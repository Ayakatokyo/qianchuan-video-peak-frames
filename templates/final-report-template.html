<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>千川 TOP 素材池商业诊断报告</title>
  <style>
    :root {
      --bg: #120b08;
      --paper: #fff8ec;
      --panel: rgba(255, 248, 236, .94);
      --ink: #2a170f;
      --muted: #806758;
      --gold: #d79a4b;
      --line: rgba(82, 45, 24, .15);
      --shadow: 0 28px 80px rgba(43, 23, 12, .18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #160d09, #3b1f15 44%, #f5dfbd 44%, #fff8ec);
      color: var(--ink);
    }

    main {
      width: min(1260px, calc(100% - 42px));
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    .hero {
      color: #fff;
      margin-bottom: 26px;
    }

    .hero-copy,
    .section,
    .material-card {
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px 36px 32px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
      color: #fff;
      border-radius: 28px;
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
    }

    h1 {
      margin: 14px 0 18px;
      font-size: clamp(38px, 5vw, 72px);
      line-height: .95;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 31px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      line-height: 1.72;
    }

    small,
    .muted {
      color: var(--muted);
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.75;
      color: rgba(255, 255, 255, .78);
    }

    .section {
      margin: 22px 0;
      padding: 28px;
      border-radius: 28px;
      background: var(--panel);
    }

    .insight-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }

    .rec-card,
    .formula {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
    }

    .rec-card {
      padding: 18px;
    }

    .primary-summary {
      padding: 0;
    }

    .primary-summary b {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
    }

    .primary-summary > p {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.72;
      color: var(--ink);
    }

    .part-label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      color: #9b6a37;
      letter-spacing: .06em;
    }

    .evidence-label {
      margin-top: 14px;
    }

    .rec-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .insight-secondary {
      width: 100%;
      grid-template-columns: 1fr;
    }

    .rec-card b {
      display: block;
      margin-bottom: 8px;
    }

    .data-dashboard {
      display: grid;
      gap: 14px;
    }

    .collapsible-head {
      margin-bottom: 12px;
    }

    .collapsible-body-title {
      display: block;
      margin-bottom: 2px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
    }

    .collapsible-toggle {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7ead8;
      color: var(--ink);
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .52);
    }

    .collapsible-toggle:hover {
      border-color: rgba(82, 45, 24, .24);
      background: #fff1dc;
    }

    .collapsible-toggle:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .collapsible-toggle-action {
      color: #2c1810;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
    }

    .collapsible-body {
      display: grid;
      gap: 12px;
    }

    .collapsible-body[hidden] {
      display: none;
    }

    .metric-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .metric-switch span {
      color: var(--muted);
      font-weight: 700;
    }

    .metric-switch button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .metric-switch button[aria-pressed="true"] {
      background: #2c1810;
      color: #fff;
      border-color: #2c1810;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .chart-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 16px;
    }

    .chart-card h3 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .chart-card-full {
      grid-column: 1 / -1;
    }

    .column-chart {
      position: relative;
      min-height: 300px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 12px;
      padding-top: 8px;
    }

    .column-y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      color: var(--muted);
      font-size: 13px;
      padding-bottom: 42px;
    }

    .column-axis-title {
      font-weight: 700;
    }

    .column-plot {
      position: relative;
      display: grid;
      align-items: end;
      gap: var(--column-gap, 12px);
      min-width: 0;
      padding: 0 8px 42px;
      border-bottom: 1px solid rgba(82, 45, 24, .22);
      background: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent 72px,
        rgba(82, 45, 24, .11) 73px
      );
    }

    .column-item {
      position: relative;
      min-width: 46px;
      height: 230px;
      display: flex;
      align-items: end;
      justify-content: center;
    }

    .column-bar {
      width: min(64px, 72%);
      min-height: 4px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(180deg, #d79a4b, #9b6a37);
      cursor: default;
    }

    .column-label {
      position: absolute;
      left: 50%;
      bottom: -34px;
      width: 92px;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
      text-align: center;
      word-break: break-word;
    }

    .chart-tooltip {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: calc(100% + 10px);
      min-width: 150px;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 14px 34px rgba(43, 23, 12, .16);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      transition: opacity .15s ease;
    }

    .chart-tooltip b {
      display: block;
      margin-bottom: 4px;
    }

    .chart-tooltip-line {
      display: block;
    }

    .column-item:hover .chart-tooltip {
      opacity: 1;
    }

    .chart-card-plain {
      border-color: transparent;
      box-shadow: none;
      padding-left: 10px;
      padding-right: 10px;
      padding-bottom: 0;
    }

    .pie-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, .75fr);
      gap: 14px;
      align-items: center;
    }

    .pie-chart {
      position: relative;
      width: 320px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(var(--gold) 0deg, var(--gold) 360deg);
      box-shadow: 0 0 0 1px rgba(82, 45, 24, .1);
    }

    .pie-legend {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .legend-item {
      position: relative;
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .pie-slice-hitbox {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      cursor: default;
    }

    .chart-tooltip.is-visible {
      opacity: 1;
    }

    .region-scale {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .region-scale-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .region-scale input[type="range"] {
      width: 100%;
      accent-color: #9b6a37;
      cursor: pointer;
    }

    .side-tabs {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      border-right: 1px solid var(--line);
      padding: 0 14px 0 0;
      position: sticky;
      top: 18px;
      align-self: stretch;
      max-height: calc(100vh - 36px);
      overflow-y: auto;
    }

    .tab-list button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ec;
      color: var(--ink);
      padding: 8px 9px;
      text-align: left;
      line-height: 1.35;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .tab-list button[aria-selected="true"] {
      background: #2c1810;
      color: #fff;
      border-color: #2c1810;
    }

    .tab-list button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .material-panels {
      min-width: 0;
    }

    .material-card {
      margin: 0;
      padding: 22px;
      border-radius: 24px;
      background: #fffdf9;
      box-shadow: 0 16px 40px rgba(65, 34, 16, .1);
    }

    .material-head {
      display: block;
    }

    .visual-strip {
      --visual-height: 560px;
      --video-width: calc(var(--visual-height) * 9 / 16);
      display: grid;
      grid-template-columns: var(--video-width) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
      margin: 18px 0;
    }

    .video-panel {
      min-width: 0;
      width: var(--video-width);
      height: var(--visual-height);
      display: flex;
      align-items: stretch;
      justify-self: start;
      overflow: hidden;
    }

    .frame-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      height: var(--visual-height);
      margin: 0;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f4e3cd;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .frame-preview-button {
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
      display: block;
    }

    .frame-preview-button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: -3px;
    }

    figure img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      background: #efe6d9;
      display: block;
    }

    figcaption {
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .material-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .formula {
      padding: 17px;
      background: #f7ead8;
      border-radius: 18px;
    }

    .raw-fact-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 17px;
    }

    .raw-fact-card > b {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .timeline-chart {
      width: 100%;
      height: 320px;
      display: block;
      border-radius: 14px;
      background: #fff8ec;
      border: 1px solid rgba(82, 45, 24, .1);
    }

    .timeline-metric-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .timeline-axis-label,
    .timeline-tick-label {
      fill: var(--muted);
      font-size: 12px;
    }

    .timeline-axis-line,
    .timeline-grid-line {
      stroke: rgba(82, 45, 24, .16);
      stroke-width: 1;
    }

    .timeline-line {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .timeline-point-dot {
      fill: #9b6a37;
      stroke: #fff8ec;
      stroke-width: 2;
    }

    .timeline-peak-dot {
      fill: #fff;
      stroke: #9b6a37;
      stroke-width: 3;
    }

    .timeline-point-hitbox {
      cursor: default;
    }

    .timeline-tooltip {
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
    }

    .timeline-point-hitbox:hover .timeline-tooltip,
    .timeline-point-hitbox:focus .timeline-tooltip {
      opacity: 1;
    }

    .timeline-peak {
      margin-top: 10px;
      color: var(--ink);
      font-weight: 800;
    }

    .timeline-scale {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .timeline-scale-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .timeline-scale input[type="range"] {
      width: 100%;
      height: 8px;
      appearance: none;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #9b6a37 0%,
        #9b6a37 var(--timeline-scale-progress, 100%),
        #ead8c0 var(--timeline-scale-progress, 100%),
        #ead8c0 100%
      );
      accent-color: #9b6a37;
      cursor: pointer;
    }

    .timeline-scale input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #fff8ec;
      border-radius: 999px;
      background: #9b6a37;
      box-shadow: 0 2px 8px rgba(82, 45, 24, .22);
    }

    .timeline-scale input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 2px solid #fff8ec;
      border-radius: 999px;
      background: #9b6a37;
      box-shadow: 0 2px 8px rgba(82, 45, 24, .22);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(82, 45, 24, .14);
      border-radius: 999px;
      padding: 5px 10px;
      background: #f7ead8;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .script-analysis-panel {
      display: grid;
      gap: 14px;
    }

    .script-analysis-section {
      display: grid;
      gap: 8px;
    }

    .script-analysis-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .script-analysis-section-header b {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.4;
    }

    .copy-button {
      flex: 0 0 auto;
      border: 1px solid rgba(82, 45, 24, .16);
      border-radius: 8px;
      padding: 5px 9px;
      background: #fff8ec;
      color: #7d4a25;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .copy-button:hover {
      border-color: rgba(155, 106, 55, .42);
      background: #f7ead8;
    }

    .script-formula-chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin: 0;
      overflow: visible;
    }

    .script-formula-text {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.65;
    }

    .script-formula-item {
      display: inline;
      min-width: 0;
      max-width: none;
      border: 0;
      border-radius: 4px;
      padding: 1px 2px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.65;
      text-align: inherit;
    }

    .script-formula-item[aria-pressed="true"] {
      background: var(--script-soft, rgba(215, 154, 75, .14));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--script-color, #9b6a37) 22%, transparent);
    }

    .script-formula-title-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ink);
    }

    .script-formula-dot,
    .script-formula-label {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 4px;
      border-radius: 2px;
      background: var(--script-color, #9b6a37);
    }

    .script-formula-title {
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .script-formula-token {
      display: inline;
      color: var(--script-color, #9b6a37);
      font-weight: 900;
    }

    .script-formula-connector {
      align-self: center;
      color: #a97949;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      margin: 0 1px;
    }

    .transcript {
      overflow: visible;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f7ead8;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .script-text-body {
      overflow: visible;
      padding: 12px 14px;
      border: 1px solid rgba(82, 45, 24, .1);
      border-radius: 8px;
      background: #fff8ec;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .script-segment {
      border-radius: 6px;
      padding: 1px 2px;
      background: var(--script-soft, rgba(215, 154, 75, .16));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--script-color, #d79a4b) 18%, transparent);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .script-segment.is-active {
      background: var(--script-active-bg, rgba(215, 154, 75, .32));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--script-color, #d79a4b) 24%, transparent);
      font-weight: 900;
    }

    .script-highlight {
      border-radius: 6px;
      background: rgba(215, 154, 75, .32);
      box-shadow: 0 0 0 2px rgba(215, 154, 75, .16);
      color: var(--ink);
      font-weight: 800;
    }

    .material-video {
      width: 100%;
      height: 100%;
      aspect-ratio: 9 / 16;
      min-height: 0;
      margin: 0;
      border-radius: 18px;
      background: #120b08;
      object-fit: cover;
    }

    .frame-lightbox {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 32px;
      background: rgba(18, 11, 8, .84);
    }

    .frame-lightbox[hidden] {
      display: none;
    }

    .frame-lightbox-dialog {
      position: relative;
      max-width: min(92vw, 1120px);
      max-height: 90vh;
      display: grid;
      gap: 12px;
    }

    .frame-lightbox img {
      max-width: min(92vw, 1120px);
      max-height: 82vh;
      object-fit: contain;
      border-radius: 18px;
      background: #120b08;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .34);
    }

    .frame-lightbox-caption {
      color: #fff8ec;
      font-weight: 800;
      text-align: center;
    }

    .frame-lightbox-close {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 248, 236, .4);
      border-radius: 999px;
      background: #fff8ec;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 22px;
      line-height: 1;
    }

    .formula b {
      display: block;
      margin-bottom: 8px;
    }

    .highlight-note b {
      display: inline;

    @media (max-width: 980px) {

      .insight-layout,

      }
    }
  </style>
</head>
<body>

<main>

<script>
const reportData = JSON.parse(document.getElementById("report-data").textContent);

function text(value, fallback = "") {
  if (value === null || value === undefined) return fallback;
  const result = String(value).trim();
  return result || fallback;
}

function formatNumber(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "-";
  if (Math.abs(number) >= 1000) return number.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  if (Number.isInteger(number)) return String(number);
  return number.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
}

function safeId(value) {
  return text(value, "unknown-material").replace(/[^a-zA-Z0-9_-]+/g, "_");
}

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
}

function createCollapseToggle(target, defaultExpanded = true) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "collapsible-toggle";
  const action = element("span", "collapsible-toggle-action", "");
  button.append(action);
  let expanded = Boolean(defaultExpanded);
  function sync() {
    button.setAttribute("aria-expanded", String(expanded));
    action.textContent = expanded ? "收起数据" : "展开数据";
    target.hidden = !expanded;
  }
  button.addEventListener("click", () => {
    expanded = !expanded;
    sync();
  });
  sync();
  return button;
}

function appendCollapsibleHead(root, title, target) {
  const head = element("div", "collapsible-head");
  target.prepend(element("b", "collapsible-body-title", title));
  head.append(createCollapseToggle(target));
  root.append(head);
}

const metricLabels = {
  SHOW_COUNT: "展现次数",
  CLICK_COUNT: "点击次数",
  TRANSACTION_AMOUNT: "成交金额",
};

const dimensionLabels = {
  user_group_label_name: "八大人群",
  age: "年龄",
  gender: "性别",
  province_name: "省份",
  city_name: "城市",
};

const frameLabels = {
  zero_second: "视频第 0 秒画面",
  peak_top_1: "点击 Top1 峰值画面",
  peak_top_2: "点击 Top2 峰值画面",
  peak_top_3: "点击 Top3 峰值画面",
};

const statusLabels = {
  succeeded: "已完成",
  missing_summary: "缺少摘要",
  failed: "失败",
  pending: "待处理",
  not_started: "未开始",
  unknown: "未知",
};

function displayStatus(value) {
  const status = text(value, "unknown");
  return statusLabels[status] || status;
}

function displayText(value) {
  return text(value)
    .replace(/\bSHOW_COUNT\b/g, "展现次数")
    .replace(/\bCLICK_COUNT\b/g, "点击次数")
    .replace(/\bTRANSACTION_AMOUNT\b/g, "成交金额")
    .replace(/\b(?:audience|script|highlight):[^\s，。；、]+/g, "对应数据证据")
    .replace(/\b\d{15,}\b/g, "对应素材")
    .replace(/对应素材([、，,]\s*对应素材)+/g, "对应素材")
    .replace(/对应数据证据([ ·、，,]\s*对应数据证据)+/g, "对应数据证据");
}

function humanizeEvidenceRef(reference) {
  const parts = text(reference).split(":");
  if (parts[0] === "audience" && parts.length >= 4) {
    const metric = metricLabels[parts[1]] || "人群数据";
    const dimension = dimensionLabels[parts[2]] || parts[2];
    return `${metric}：${dimension} ${parts.slice(3).join(":")}`;
  }
  if (parts[0] === "script" && parts.length >= 4) {
    const labels = parts.slice(2).filter(Boolean);
    const uniqueLabels = labels.filter((label, index) => labels.indexOf(label) === index);
    return `脚本标签：${uniqueLabels.join(" / ")}`;
  }
  if (parts[0] === "highlight" && parts.length >= 3) {
    return `高光帧：${frameLabels[parts[2]] || parts[2]}`;
  }
  return "结构化证据";
}

function renderPrimaryInsight(targetId, insights, conclusionLabel, emptyTitle) {
  const target = document.getElementById(targetId);
  target.replaceChildren();
  const first = Array.isArray(insights) && insights.length > 0 ? insights[0] : null;
  target.append(
    element("b", "", first ? displayText(first.title) : emptyTitle),
    element("p", "", first ? displayText(first.conclusion) : "请补充结构化分析后重新渲染。")
  );
}

function topBuckets(dimension, limit = 8) {
  const buckets = Array.isArray(dimension?.buckets) ? dimension.buckets : [];
  return buckets.slice(0, limit);
}

function appendTooltipLines(tooltip, title, lines) {
  tooltip.replaceChildren();
  tooltip.append(element("b", "", title));
  (Array.isArray(lines) ? lines : [lines]).filter(Boolean).forEach((line) => {
    tooltip.append(element("span", "chart-tooltip-line", line));
  });
}

function renderColumnChart(title, buckets, valueFormatter, options = {}) {
  const card = element("div", `chart-card chart-card-full${options.cardClass ? ` ${options.cardClass}` : ""}`);
  card.append(element("h3", "", title));
  if (!Array.isArray(buckets) || buckets.length === 0) {
    card.append(element("p", "muted", "暂无可视化数据"));
    return card;
  }
  const valueAccessor = options.valueAccessor || ((bucket) => Number(bucket.metricPercentage ?? bucket.value ?? 0));
  const tooltipFormatter = options.tooltipFormatter || valueFormatter || ((bucket) => `${formatNumber(valueAccessor(bucket))}%`);
  const tooltipLines = options.tooltipLines || ((bucket) => [tooltipFormatter(bucket)]);
  const axisValueFormatter = options.axisValueFormatter || ((value) => valueFormatter ? valueFormatter({ value, metricPercentage: value }) : `${formatNumber(value)}%`);
  const itemTitleFormatter = options.itemTitleFormatter || ((bucket) => `${text(bucket.bucket ?? bucket.label)}：${tooltipFormatter(bucket)}`);
  const axisLabel = text(options.axisLabel);
  const values = buckets.map((bucket) => valueAccessor(bucket));
  const maxValue = Math.max(...values, 1);
  const axisMax = Math.ceil(maxValue / 10) * 10 || 10;
  const itemCount = buckets.length;
  const labelStep = Math.max(1, Math.ceil(itemCount / (options.maxLabels || 12)));
  const chart = element("div", "column-chart");
  chart.style.setProperty("--column-count", String(itemCount));
  const axis = element("div", "column-y-axis");
  const axisTicks = Array.isArray(options.axisTicks) && options.axisTicks.length > 0
    ? options.axisTicks
    : [axisMax, axisMax * .75, axisMax * .5, axisMax * .25, 0];
  if (axisLabel) {
    axis.append(element("span", "column-axis-title", axisLabel));
  }
  axisTicks.forEach((value) => {
    axis.append(element("span", "", axisValueFormatter(value)));
  });
  const plot = element("div", "column-plot");
  plot.style.gridTemplateColumns = `repeat(${itemCount}, minmax(0, 1fr))`;
  plot.style.setProperty("--column-gap", itemCount > 24 ? "4px" : itemCount > 14 ? "8px" : "18px");
  buckets.forEach((bucket, index) => {
    const value = valueAccessor(bucket);
    const item = element("div", "column-item");
    item.title = itemTitleFormatter(bucket);
    item.style.minWidth = itemCount > 24 ? "0" : "46px";
    const bar = element("div", "column-bar");
    bar.style.height = `${Math.max(2, value / axisMax * 100)}%`;
    bar.style.width = itemCount > 24 ? "100%" : "min(64px, 72%)";
    const label = element("span", "column-label", index % labelStep === 0 || index === itemCount - 1 ? text(bucket.bucket ?? bucket.label) : "");
    label.style.width = itemCount > 24 ? "48px" : itemCount > 14 ? "72px" : "92px";
    const tooltip = element("div", "chart-tooltip");
    appendTooltipLines(tooltip, text(bucket.bucket ?? bucket.label), tooltipLines(bucket));
    item.append(bar, label, tooltip);
    plot.append(item);
  });
  chart.append(axis, plot);
  card.append(chart);
  return card;
}

const chartColors = ["#9b6a37", "#d79a4b", "#6f7f5f", "#a14f38", "#6d5d4d", "#c7a36a", "#7d8f9a", "#b77d54"];

function buildPieSliceTooltipMap(buckets) {
  const total = buckets.reduce((sum, bucket) => sum + Number(bucket.metricPercentage || 0), 0) || 1;
  let cursor = 0;
  return buckets.map((bucket, index) => {
    const percentage = Number(bucket.metricPercentage || 0);
    const slice = {
      bucket,
      color: chartColors[index % chartColors.length],
      startRatio: cursor / total,
      endRatio: (cursor + percentage) / total,
    };
    cursor += percentage;
    return slice;
  });
}

function findPieBucketAtPosition(event, pie, slices) {
  const rect = pie.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const dx = event.clientX - centerX;
  const dy = event.clientY - centerY;
  const radius = Math.min(rect.width, rect.height) / 2;
  if (Math.sqrt(dx * dx + dy * dy) > radius) return null;
  const angle = (Math.atan2(dy, dx) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
  const ratio = angle / (Math.PI * 2);
  return slices.find((slice) => ratio >= slice.startRatio && ratio < slice.endRatio) || slices[slices.length - 1] || null;
}

function renderPieChart(title, buckets) {
  const card = element("div", "chart-card");
  card.append(element("h3", "", title));
  if (!Array.isArray(buckets) || buckets.length === 0) {
    card.append(element("p", "muted", "暂无可视化数据"));
    return card;
  }
  const pieTooltipBuckets = buildPieSliceTooltipMap(buckets);
  const stops = pieTooltipBuckets.map((slice) => `${slice.color} ${slice.startRatio * 360}deg ${slice.endRatio * 360}deg`);
  const layout = element("div", "pie-layout");
  const pie = element("div", "pie-chart");
  pie.style.background = `conic-gradient(${stops.join(", ")})`;
  const pieTooltip = element("div", "chart-tooltip");
  pie.append(pieTooltip);
  function showPieTooltip(bucket) {
    appendTooltipLines(pieTooltip, text(bucket.bucket), [`占比 ${formatNumber(bucket.metricPercentage)}%`]);
    pie.title = `${text(bucket.bucket)}：占比 ${formatNumber(bucket.metricPercentage)}%`;
    pieTooltip.classList.add("is-visible");
  }
  function syncPieTooltip(event) {
    const activeBucket = findPieBucketAtPosition(event, pie, pieTooltipBuckets);
    if (activeBucket) showPieTooltip(activeBucket.bucket);
  }
  pie.addEventListener("pointerenter", (event) => {
    syncPieTooltip(event);
  });
  pie.addEventListener("pointermove", (event) => {
    syncPieTooltip(event);
  });
  pie.addEventListener("pointerleave", () => {
    pieTooltip.classList.remove("is-visible");
  });
  showPieTooltip(pieTooltipBuckets[0].bucket);
  pieTooltip.classList.remove("is-visible");
  const legend = element("ul", "pie-legend");
  buckets.forEach((bucket, index) => {
    const item = element("li", "legend-item");
    item.title = `${text(bucket.bucket)}：占比 ${formatNumber(bucket.metricPercentage)}%`;
    const swatch = element("span", "legend-swatch");
    swatch.style.background = chartColors[index % chartColors.length];
    item.append(swatch, element("span", "", text(bucket.bucket)), element("span", "", `${formatNumber(bucket.metricPercentage)}%`));
    legend.append(item);
  });
  layout.append(pie, legend);
  card.append(layout);
  return card;
}

function createRegionScaleControl(state, onChange, totalCount) {
  if (!state.control) {
    const scale = element("div", "region-scale");
    const head = element("div", "region-scale-head");
    const title = element("span", "", "");
    const detail = element("span", "", "");
    head.append(title, detail);
    const scaleInput = document.createElement("input");
    scaleInput.type = "range";
    scaleInput.max = "1";
    scaleInput.step = "0.005";
    scaleInput.addEventListener("input", () => {
      state.ratio = Number(scaleInput.value);
      if (state.metaTitle && state.metaDetail) {
        const visibleRatio = Number(state.ratio || 0.35);
        state.metaTitle.textContent = `柱状图展示比例 ${Math.round(visibleRatio * 100)}%`;
        state.metaDetail.textContent = `当前显示 ${Math.max(1, Math.ceil(state.totalCount * visibleRatio))}/${state.totalCount}`;
      }
      onChange();
    });
    scale.append(head, scaleInput);
    state.control = scaleInput;
    state.metaTitle = title;
    state.metaDetail = detail;
    state.root = scale;
  }
  state.totalCount = totalCount;
  state.control.min = String(state.minRatio || 0.02);
  state.control.value = String(state.ratio || 0.35);
  function syncScaleMeta() {
    const visibleRatio = Number(state.ratio || 0.35);
    state.metaTitle.textContent = `柱状图展示比例 ${Math.round(visibleRatio * 100)}%`;
    state.metaDetail.textContent = `当前显示 ${Math.max(1, Math.ceil(totalCount * visibleRatio))}/${totalCount}`;
  }
  syncScaleMeta();
  return state.root;
}

function renderRegionChart(card, dimensions) {
  const tabs = element("div", "metric-switch");
  tabs.append(element("span", "", "地域口径："));
  const body = element("div", "");
  card.append(tabs, body);
  const options = [
    ["province_name", "省份"],
    ["city_name", "城市"],
  ];
  const regionState = {
    province_name: { ratio: 0.35, minRatio: 0.05, minVisible: 6 },
    city_name: { ratio: 0.16, minRatio: 0.005, minVisible: 4 },
  };
  let activeDimensionKey = "province_name";
  const chartMount = element("div", "");
  const scaleMount = element("div", "");
  body.append(chartMount, scaleMount);
  function renderRegion(dimensionKey) {
    activeDimensionKey = dimensionKey || activeDimensionKey;
    tabs.querySelectorAll("button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.dimension === activeDimensionKey));
    });
    const allBuckets = Array.isArray(dimensions[activeDimensionKey]?.buckets) ? dimensions[activeDimensionKey].buckets : [];
    const state = regionState[activeDimensionKey] || { ratio: 0.35 };
    const visibleRatio = Number(state.ratio || 0.35);
    const minVisible = state.minVisible || (activeDimensionKey === "city_name" ? 12 : 8);
    const visibleCount = Math.max(minVisible, Math.ceil(allBuckets.length * visibleRatio));
    const visibleBuckets = allBuckets.slice(0, Math.min(allBuckets.length, visibleCount));
    const chart = renderColumnChart(`${dimensionLabels[activeDimensionKey]}分布`, visibleBuckets, null, {
      cardClass: "chart-card-plain",
      axisLabel: "人数",
      valueAccessor: (bucket) => Number(bucket.metricValue ?? bucket.value ?? 0),
      axisValueFormatter: (value) => formatNumber(value),
      tooltipFormatter: (bucket) => `地域占比 ${formatNumber(bucket.metricPercentage ?? 0)}% · 人数 ${formatNumber(bucket.metricValue ?? bucket.value ?? 0)}`,
      itemTitleFormatter: (bucket) => `${text(bucket.bucket ?? bucket.label)}：人数 ${formatNumber(bucket.metricValue ?? bucket.value ?? 0)} · 地域占比 ${formatNumber(bucket.metricPercentage ?? 0)}%`,
      tooltipLines: (bucket) => [
        `占比 ${formatNumber(bucket.metricPercentage ?? 0)}%`,
        `人数 ${formatNumber(bucket.metricValue ?? bucket.value ?? 0)}`,
      ],
      maxLabels: activeDimensionKey === "city_name" ? 16 : 18,
    });
    chartMount.replaceChildren(chart);
    const scale = createRegionScaleControl(state, renderRegion, allBuckets.length);
    if (scaleMount.firstChild !== scale) {
      scaleMount.replaceChildren(scale);
    }
  }
  options.forEach(([dimensionKey, label], index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.dimension = dimensionKey;
    button.setAttribute("aria-pressed", String(index === 0));
    button.textContent = label;
    button.addEventListener("click", () => renderRegion(dimensionKey));
    tabs.append(button);
  });
  renderRegion(activeDimensionKey);
}

function renderAudienceDashboard() {
  const root = document.getElementById("audience-dashboard");
  const metrics = reportData.audience?.metrics || {};
  const metricKeys = ["SHOW_COUNT", "TRANSACTION_AMOUNT", "CLICK_COUNT"].filter((key) => metrics[key]);
  root.replaceChildren();
  if (metricKeys.length === 0) {
    root.append(element("p", "muted", "暂无人群汇总数据"));
    return;
  }
  const body = element("div", "collapsible-body");
  appendCollapsibleHead(root, "人群真实数据", body);
  const switcher = element("div", "metric-switch");
  switcher.append(element("span", "", "展示指标："));
  const chartGrid = element("div", "chart-grid");
  body.append(switcher, chartGrid);
  root.append(body);

  function renderMetric(metricKey) {
    switcher.querySelectorAll("button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.metric === metricKey));
    });
    chartGrid.replaceChildren();
    const dimensions = metrics[metricKey]?.dimensions || {};
    const regionCard = element("div", "chart-card chart-card-full chart-card-plain");
    regionCard.append(element("h3", "", "地域分布"));
    renderRegionChart(regionCard, dimensions);
    chartGrid.append(
      renderColumnChart("八大人群分布", topBuckets(dimensions.user_group_label_name), null, {
        tooltipFormatter: (bucket) => `占比 ${formatNumber(bucket.metricPercentage ?? bucket.value)}%`,
        tooltipLines: (bucket) => [`占比 ${formatNumber(bucket.metricPercentage ?? bucket.value)}%`],
      }),
      renderPieChart("年龄分布", topBuckets(dimensions.age, 6)),
      renderPieChart("性别分布", topBuckets(dimensions.gender, 4)),
      regionCard
    );
  }

  metricKeys.forEach((metricKey, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.metric = metricKey;
    button.setAttribute("aria-pressed", String(index === 0));
    button.textContent = metricLabels[metricKey] || metricKey;
    button.addEventListener("click", () => renderMetric(metricKey));
    switcher.append(button);
  });
  renderMetric(metricKeys[0]);
}

function renderScriptDashboard() {
  const root = document.getElementById("script-dashboard");
  const summary = Array.isArray(reportData.scripts?.labelSummary) ? reportData.scripts.labelSummary : [];
  root.replaceChildren();
  const level1 = {};
  summary.forEach((item) => {
    const key = text(item.level1, "其他");
    level1[key] = (level1[key] || 0) + Number(item.occurrenceCount || 0);
  });
  const level1Buckets = Object.entries(level1)
    .map(([label, value]) => ({ bucket: label, value }))
    .sort((left, right) => right.value - left.value);
  const totalOccurrences = level1Buckets.reduce((sum, bucket) => sum + Number(bucket.value || 0), 0) || 1;
  const maxCount = Math.max(...level1Buckets.map((bucket) => Number(bucket.value || 0)), 0);
  const chartGrid = element("div", "chart-grid");
  chartGrid.append(renderColumnChart("内容公式一级标签分布", level1Buckets, (bucket) => `${formatNumber(bucket.value ?? bucket.metricPercentage)} 次`, {
    axisTicks: [maxCount, Math.round(maxCount * 0.75), Math.round(maxCount * 0.5), Math.round(maxCount * 0.25), 0],
    axisValueFormatter: (value) => `${Math.round(value)} 次`,
    tooltipLines: (bucket) => [
      `占比 ${formatNumber((Number(bucket.value || 0) / totalOccurrences) * 100)}%`,
      `次数 ${formatNumber(bucket.value || 0)} 次`,
    ],
  }));
  root.append(chartGrid);
}

function renderFrames(material) {
  const grid = element("div", "frame-grid");
  const frames = Array.isArray(material.highlightFrames) ? material.highlightFrames : [];
  if (frames.length === 0) {
    grid.append(element("p", "muted", "暂无高光帧"));
    return grid;
  }
  frames.forEach((frame) => {
    const figure = document.createElement("figure");
    const button = document.createElement("button");
    const image = document.createElement("img");
    const captionText = `${formatNumber(frame.durationSec)}s · 点击 ${formatNumber(frame.metricValue)}`;
    button.type = "button";
    button.className = "frame-preview-button";
    button.setAttribute("aria-label", `查看大图：${captionText}`);
    image.src = text(frame.framePath);
    image.alt = "高光帧";
    image.loading = "lazy";
    image.decoding = "async";
    button.append(image);
    button.addEventListener("click", () => openFrameLightbox(text(frame.framePath), captionText));
    const caption = element("figcaption", "", captionText);
    figure.append(button, caption);
    grid.append(figure);
  });
  return grid;
}

function openFrameLightbox(src, caption) {
  const lightbox = document.getElementById("frame-lightbox");
  const image = document.getElementById("frame-lightbox-image");
  const captionNode = document.getElementById("frame-lightbox-caption");
  image.src = src;
  captionNode.textContent = caption;
  lightbox.hidden = false;
  document.body.style.overflow = "hidden";
  lightbox.querySelector(".frame-lightbox-close").focus();
}

function closeFrameLightbox() {
  const lightbox = document.getElementById("frame-lightbox");
  const image = document.getElementById("frame-lightbox-image");
  lightbox.hidden = true;
  image.removeAttribute("src");
  document.body.style.overflow = "";
}

function renderFormula(title, paragraphs) {
  const card = element("div", "formula");
  card.append(element("b", "", title));
  paragraphs.forEach((paragraph) => card.append(element("p", "", displayText(paragraph))));
  return card;
}

function formatTimelineSecond(second) {
  const safeSecond = Math.max(0, Math.round(Number(second || 0)));
  const minutes = Math.floor(safeSecond / 60);
  const seconds = safeSecond % 60;
  return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

function svgElement(tagName, attributes = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tagName);
  Object.entries(attributes).forEach(([key, value]) => {
    node.setAttribute(key, String(value));
  });
  return node;
}

function updateTimelineScaleTrack(state) {
  if (!state.control) return;
  const min = Number(state.control.min || 0);
  const max = Number(state.control.max || 1);
  const value = Number(state.control.value || state.visibleRatio || 1);
  const progress = max > min ? ((value - min) / (max - min)) * 100 : 100;
  state.control.style.setProperty("--timeline-scale-progress", `${Math.max(0, Math.min(100, progress))}%`);
}

function createTimelineScaleControl(state, onChange) {
  if (!state.control) {
    const scale = element("div", "timeline-scale");
    const head = element("div", "timeline-scale-head");
    const title = element("span", "", "");
    const detail = element("span", "", "");
    head.append(title, detail);
    const scaleInput = document.createElement("input");
    scaleInput.type = "range";
    scaleInput.min = "0.25";
    scaleInput.max = "1";
    scaleInput.step = "0.05";
    scaleInput.addEventListener("input", () => {
      state.visibleRatio = Number(scaleInput.value);
      updateTimelineScaleTrack(state);
      if (state.activeMetric) {
        onChange(state.activeMetric);
      }
    });
    scale.append(head, scaleInput);
    state.control = scaleInput;
    state.metaTitle = title;
    state.metaDetail = detail;
    state.root = scale;
  }
  const ratio = Number(state.visibleRatio || 1);
  const maxSecond = Number(state.maxSecond || 0);
  state.control.value = String(ratio);
  updateTimelineScaleTrack(state);
  state.metaTitle.textContent = `时间范围 ${Math.round(ratio * 100)}%`;
  state.metaDetail.textContent = maxSecond > 0
    ? `当前显示 00:00-${formatTimelineSecond(maxSecond * ratio)} / ${formatTimelineSecond(maxSecond)}`
    : "暂无可缩放时长";
  return state.root;
}

function renderTimelineChart(metric, visibleRatio = 1) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "timeline-chart");
  svg.setAttribute("viewBox", "0 0 840 320");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${text(metric.label)}趋势图`);
  const allPoints = Array.isArray(metric.points) ? metric.points : [];
  const maxSecond = Math.max(...allPoints.map((point) => Number(point.second || 0)), 1);
  const visibleMaxSecond = Math.max(1, maxSecond * Number(visibleRatio || 1));
  const points = allPoints.filter((point) => Number(point.second || 0) <= visibleMaxSecond);
  if (points.length === 0) {
    return svg;
  }
  const bounds = {
    left: 78,
    right: 810,
    top: 56,
    bottom: 266,
  };
  const width = bounds.right - bounds.left;
  const height = bounds.bottom - bounds.top;
  const maxValue = Math.max(...points.map((point) => Number(point.value || 0)), 1);
  const yTicks = [maxValue, maxValue * 0.75, maxValue * 0.5, maxValue * 0.25, 0];
  yTicks.forEach((value) => {
    const y = bounds.bottom - (Number(value || 0) / maxValue) * height;
    svg.append(
      svgElement("line", {
        class: "timeline-grid-line",
        x1: bounds.left,
        x2: bounds.right,
        y1: y.toFixed(2),
        y2: y.toFixed(2),
      }),
      svgElement("text", {
        class: "timeline-tick-label",
        x: bounds.left - 12,
        y: (y + 4).toFixed(2),
        "text-anchor": "end",
      })
    );
    svg.lastChild.textContent = formatNumber(value);
  });
  const xTicks = [0, 0.25, 0.5, 0.75, 1].map((ratio) => visibleMaxSecond * ratio);
  xTicks.forEach((second) => {
    const x = bounds.left + (Number(second || 0) / visibleMaxSecond) * width;
    svg.append(
      svgElement("line", {
        class: "timeline-grid-line",
        x1: x.toFixed(2),
        x2: x.toFixed(2),
        y1: bounds.top,
        y2: bounds.bottom,
      }),
      svgElement("text", {
        class: "timeline-tick-label",
        x: x.toFixed(2),
        y: bounds.bottom + 24,
        "text-anchor": "middle",
      })
    );
    svg.lastChild.textContent = formatTimelineSecond(second);
  });
  svg.append(
    svgElement("line", {
      class: "timeline-axis-line",
      x1: bounds.left,
      x2: bounds.left,
      y1: bounds.top,
      y2: bounds.bottom,
    }),
    svgElement("line", {
      class: "timeline-axis-line",
      x1: bounds.left,
      x2: bounds.right,
      y1: bounds.bottom,
      y2: bounds.bottom,
    })
  );
  const axisLabel = svgElement("text", {
    class: "timeline-metric-label",
    x: bounds.left,
    y: 30,
  });
  axisLabel.textContent = text(metric.label);
  svg.append(axisLabel);
  const pathData = points.map((point, index) => {
    const x = bounds.left + (Number(point.second || 0) / visibleMaxSecond) * width;
    const y = bounds.bottom - (Number(point.value || 0) / maxValue) * height;
    return `${index === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(" ");
  const path = svgElement("path", {
    class: "timeline-line",
    d: pathData,
  });
  svg.append(path);
  const peak = metric.peak || {};
  points.forEach((point) => {
    const cx = bounds.left + (Number(point.second || 0) / visibleMaxSecond) * width;
    const cy = bounds.bottom - (Number(point.value || 0) / maxValue) * height;
    const group = svgElement("g", {
      class: "timeline-point-hitbox",
      tabindex: "0",
    });
    group.append(
      svgElement("circle", {
        cx: cx.toFixed(2),
        cy: cy.toFixed(2),
        r: "10",
        fill: "transparent",
      }),
      svgElement("circle", {
        cx: cx.toFixed(2),
        cy: cy.toFixed(2),
        r: "4",
        class: "timeline-point-dot",
      })
    );
    const tooltip = svgElement("g", {
      class: "timeline-tooltip",
      transform: `translate(${Math.min(bounds.right - 150, Math.max(bounds.left, cx - 74)).toFixed(2)} ${Math.max(bounds.top + 8, cy - 58).toFixed(2)})`,
    });
    tooltip.append(svgElement("rect", {
      width: "148",
      height: "46",
      rx: "8",
      fill: "rgba(255, 255, 255, .96)",
      stroke: "rgba(82, 45, 24, .16)",
    }));
    const tooltipTime = svgElement("text", {
      x: "12",
      y: "18",
      fill: "#2a170f",
      "font-size": "12",
      "font-weight": "800",
    });
    tooltipTime.textContent = formatTimelineSecond(point.second);
    const tooltipValue = svgElement("text", {
      x: "12",
      y: "36",
      fill: "#806758",
      "font-size": "12",
    });
    tooltipValue.textContent = `${text(metric.label)}：${formatNumber(point.value)}`;
    tooltip.append(tooltipTime, tooltipValue);
    group.append(tooltip);
    svg.append(group);
  });
  if (peak.second !== undefined && peak.value !== undefined && Number(peak.second || 0) <= visibleMaxSecond) {
    const cx = bounds.left + (Number(peak.second || 0) / visibleMaxSecond) * width;
    const cy = bounds.bottom - (Number(peak.value || 0) / maxValue) * height;
    const dot = svgElement("circle", {
      class: "timeline-peak-dot",
      cx: cx.toFixed(2),
      cy: cy.toFixed(2),
      r: "6",
    });
    const label = svgElement("text", {
      class: "timeline-axis-label",
      x: Math.min(bounds.right - 34, cx + 10).toFixed(2),
      y: Math.max(bounds.top + 12, cy - 10).toFixed(2),
    });
    label.textContent = "峰值";
    svg.append(dot, label);
  }
  return svg;
}

function renderInteractionTimeline(material) {
  const card = element("div", "raw-fact-card");
  const metrics = Array.isArray(material.interactionTimeline?.metrics)
    ? material.interactionTimeline.metrics
    : [];
  if (metrics.length === 0) {
    card.append(element("b", "", "互动时序分析"));
    card.append(element("p", "muted", "暂无互动时序数据"));
    return card;
  }
  const body = element("div", "collapsible-body");
  appendCollapsibleHead(card, "互动时序分析", body);
  const switcher = element("div", "metric-switch");
  const chartMount = element("div", "");
  const scaleMount = element("div", "");
  const peakNote = element("p", "timeline-peak");
  const state = { visibleRatio: 1, activeMetric: null };
  card.dataset.timelineReady = "false";
  card._timelineMetrics = metrics;
  card._timelineRenderMetric = renderMetric;
  body.append(switcher, chartMount, scaleMount, peakNote);
  card.append(body);

  function renderMetric(metric) {
    state.activeMetric = metric;
    state.maxSecond = Math.max(...(Array.isArray(metric.points) ? metric.points : []).map((point) => Number(point.second || 0)), 1);
    switcher.querySelectorAll("button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.metric === metric.metric));
    });
    chartMount.replaceChildren(renderTimelineChart(metric, state.visibleRatio));
    const scale = createTimelineScaleControl(state, renderMetric);
    if (scaleMount.firstChild !== scale) {
      scaleMount.replaceChildren(scale);
    }
    const peak = metric.peak || {};
    peakNote.textContent = `${text(metric.label)}峰值：${formatTimelineSecond(peak.second)}，${formatNumber(peak.value)} 次`;
  }

  metrics.forEach((metric, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.metric = text(metric.metric);
    button.setAttribute("aria-pressed", String(index === 0));
    button.textContent = text(metric.label || metric.metric);
    button.addEventListener("click", () => {
      renderMetric(metric);
      card.dataset.timelineReady = "true";
    });
    switcher.append(button);
  });
  return card;
}

function renderChipList(items) {
  const list = element("div", "chip-list");
  items.forEach((item) => {
    const label = typeof item === "string" ? item : `${text(item.level1)} / ${text(item.level2)}`;
    if (label.trim()) {
      list.append(element("span", "chip", label));
    }
  });
  return list;
}

function scriptFormulaLabel(item) {
  if (typeof item === "string") return text(item);
  return `${text(item.level1)} / ${text(item.level2)}`;
}

function formulaKey(item) {
  if (typeof item === "string") return `formula:${text(item)}`;
  const level1 = text(item && item.level1);
  const level2 = text(item && item.level2);
  const fallback = text(item && item.label, text(item && item.name, "unknown"));
  return `formula:${level1 || fallback}:${level2 || fallback}`;
}

function formulaColorKey(item) {
  if (typeof item === "string") return text(item, "内容公式");
  return text(item && item.level1, text(item && item.label, text(item && item.name, "内容公式")));
}

function scriptFormulaColor(index) {
  const palette = [
    "#2f8f5b",
    "#d5543f",
    "#d98324",
    "#3478c7",
    "#169a9a",
    "#c4477e",
    "#7157c8",
    "#6f7f2f",
    "#b35d24",
    "#4f7f96",
    "#a64d79",
    "#8a6f2a"
  ];
  if (index < palette.length) return palette[index];
  const hue = (index * 47 + 19) % 360;
  return `hsl(${hue} 64% 42%)`;
}

function buildFormulaColorMap(formula) {
  const colorByFormula = new Map();
  if (!Array.isArray(formula)) return colorByFormula;
  formula.forEach((item) => {
    const key = formulaColorKey(item);
    if (key && !colorByFormula.has(key)) {
      colorByFormula.set(key, scriptFormulaColor(colorByFormula.size));
    }
  });
  return colorByFormula;
}

function colorSoftBackground(color, alpha) {
  if (color.startsWith("#")) {
    const raw = color.slice(1);
    const normalized = raw.length === 3 ? raw.split("").map((part) => part + part).join("") : raw;
    const red = parseInt(normalized.slice(0, 2), 16);
    const green = parseInt(normalized.slice(2, 4), 16);
    const blue = parseInt(normalized.slice(4, 6), 16);
    if ([red, green, blue].every(Number.isFinite)) {
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }
  }
  return `color-mix(in srgb, ${color} ${Math.round(alpha * 100)}%, transparent)`;
}

function formulaDisplayParts(item) {
  if (typeof item === "string") {
    return { title: "内容公式", content: text(item) };
  }
  const title = text(item && item.level1, "内容公式");
  const content = text(item && item.level2, title);
  return { title, content };
}

function formulaCopyText(formula) {
  if (!Array.isArray(formula)) return "";
  return formula.map((item) => {
    if (typeof item === "string") return text(item);
    const parts = formulaDisplayParts(item);
    return parts.title === parts.content ? parts.title : `${parts.title}-${parts.content}`;
  }).filter(Boolean).join(" + ");
}

function copyTextToClipboard(button, value) {
  const copyValue = text(value);
  if (!copyValue) return;
  const defaultLabel = button.dataset.defaultLabel || button.textContent || "复制";
  button.dataset.defaultLabel = defaultLabel;
  function showStatus(label) {
    button.textContent = label;
    window.clearTimeout(button._copyStatusTimer);
    button._copyStatusTimer = window.setTimeout(() => {
      button.textContent = defaultLabel;
    }, 1400);
  }
  const fallbackCopy = () => {
    const textarea = document.createElement("textarea");
    textarea.value = copyValue;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.append(textarea);
    textarea.select();
    try {
      const copied = document.execCommand("copy");
      showStatus(copied ? "已复制" : "复制失败");
    } catch (error) {
      showStatus("复制失败");
    } finally {
      textarea.remove();
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(copyValue).then(() => showStatus("已复制")).catch(fallbackCopy);
    return;
  }
  fallbackCopy();
}

function copyScriptFormula(button, formula) {
  copyTextToClipboard(button, formulaCopyText(formula));
}

function copyScriptText(button, scriptText) {
  copyTextToClipboard(button, scriptText);
}

function formulaMatchesEvidence(formulaItem, evidenceItem) {
  return formulaEvidenceMatchScore(formulaItem, evidenceItem) > 0;
}

function formulaEvidenceMatchScore(formulaItem, evidenceItem) {
  const formulaLevel1 = text(formulaItem.level1);
  const formulaLevel2 = text(formulaItem.level2);
  const evidenceLevel1 = text(evidenceItem.level1);
  const evidenceLevel2 = text(evidenceItem.level2);
  if (formulaLevel2 && (formulaLevel2 === evidenceLevel2 || formulaLevel2 === evidenceLevel1)) return 3;
  if (formulaLevel1 && (formulaLevel1 === evidenceLevel1 || formulaLevel1 === evidenceLevel2)) return 1;
  return 0;
}

function matchingEvidenceSentences(formulaItem, evidence) {
  if (!formulaItem || !Array.isArray(evidence)) return [];
  const sentences = [];
  evidence.forEach((item) => {
    const sentence = text(item.sentence);
    if (sentence && formulaMatchesEvidence(formulaItem, item) && !sentences.includes(sentence)) {
      sentences.push(sentence);
    }
  });
  return sentences;
}

function evidenceFormulaMeta(evidenceItem, formula, colorByKey) {
  let matchedIndex = -1;
  let bestScore = 0;
  formula.forEach((item, index) => {
    const score = formulaEvidenceMatchScore(item, evidenceItem);
    if (score > bestScore) {
      bestScore = score;
      matchedIndex = index;
    }
  });
  if (matchedIndex < 0) return null;
  const item = formula[matchedIndex];
  const key = formulaKey(item);
  const colorKey = formulaColorKey(item);
  return {
    key,
    colorKey,
    color: colorByKey.get(key) || scriptFormulaColor(matchedIndex),
    title: scriptFormulaLabel(item)
  };
}

function collectScriptEvidenceRanges(scriptText, evidence, formula, colorByKey) {
  const fullText = text(scriptText);
  if (!fullText || !Array.isArray(evidence) || !Array.isArray(formula)) return [];
  const ranges = [];
  evidence.forEach((item) => {
    const sentence = text(item && item.sentence);
    const meta = sentence ? evidenceFormulaMeta(item, formula, colorByKey) : null;
    if (!sentence || !meta) return;
    let cursor = 0;
    while (cursor < fullText.length) {
      const start = fullText.indexOf(sentence, cursor);
      if (start < 0) break;
      ranges.push({ start, end: start + sentence.length, ...meta });
      cursor = start + sentence.length;
    }
  });
  ranges.sort((left, right) => left.start - right.start || right.end - left.end);
  const merged = [];
  ranges.forEach((range) => {
    const previous = merged[merged.length - 1];
    if (!previous || range.start >= previous.end) {
      merged.push(range);
    }
  });
  return merged;
}

function activateScriptFormula(container, activeKey) {
  if (!container) return;
  container.querySelectorAll("[data-formula-key]").forEach((node) => {
    const isActive = Boolean(activeKey && node.dataset.formulaKey === activeKey);
    if (node.classList.contains("script-formula-token")) {
      node.setAttribute("aria-pressed", String(isActive));
    }
    if (node.classList.contains("script-segment")) {
      node.classList.toggle("is-active", isActive);
      node.classList.toggle("script-highlight", isActive);
    }
  });
}

function applyScriptFormulaState(root, activeKey) {
  activateScriptFormula(root, activeKey);
}

function appendHighlightedTranscript(root, scriptText, highlightSentences) {
  root.replaceChildren();
  const fullText = text(scriptText);
  const ranges = [];
  highlightSentences.forEach((sentence) => {
    const highlightText = text(sentence);
    const start = fullText.indexOf(highlightText);
    if (start >= 0) {
      ranges.push({ start, end: start + highlightText.length });
    }
  });
  ranges.sort((left, right) => left.start - right.start);
  const merged = [];
  ranges.forEach((range) => {
    const previous = merged[merged.length - 1];
    if (!previous || range.start >= previous.end) {
      merged.push(range);
    }
  });
  if (merged.length === 0) {
    root.textContent = fullText;
    return;
  }
  let cursor = 0;
  merged.forEach((range) => {
    if (range.start > cursor) {
      root.append(document.createTextNode(fullText.slice(cursor, range.start)));
    }
    root.append(element("span", "script-highlight", fullText.slice(range.start, range.end)));
    cursor = range.end;
  });
  if (cursor < fullText.length) {
    root.append(document.createTextNode(fullText.slice(cursor)));
  }
}

function renderScriptTranscript(scriptText, evidence, formula, activeKey, colorByKey) {
  const transcript = element("div", "transcript script-text-body script-transcript");
  const fullText = text(scriptText);
  const ranges = collectScriptEvidenceRanges(fullText, evidence, formula, colorByKey);
  if (ranges.length === 0) {
    transcript.textContent = fullText;
    return transcript;
  }
  let cursor = 0;
  ranges.forEach((range) => {
    if (range.start > cursor) {
      transcript.append(document.createTextNode(fullText.slice(cursor, range.start)));
    }
    const segment = element("span", "script-segment", fullText.slice(range.start, range.end));
    segment.dataset.formulaKey = range.key;
    segment.setAttribute("data-formula-color-key", range.colorKey);
    segment.title = range.title;
    segment.style.setProperty("--script-color", range.color);
    segment.style.setProperty("--script-soft", colorSoftBackground(range.color, .14));
    segment.style.setProperty("--script-active-bg", colorSoftBackground(range.color, .28));
    segment.addEventListener("click", () => {
      const panel = segment.closest(".script-analysis-panel");
      activateScriptFormula(panel, segment.dataset.formulaKey);
    });
    transcript.append(segment);
    cursor = range.end;
  });
  if (cursor < fullText.length) {
    transcript.append(document.createTextNode(fullText.slice(cursor)));
  }
  applyScriptFormulaState(transcript, activeKey);
  return transcript;
}

function renderScriptFormulaChain(formula, evidence, transcriptMount, scriptText, colorByKey) {
  const list = element("div", "script-formula-chain script-formula-text");
  const activeKey = formula.length > 0 ? formulaKey(formula[0]) : "";
  const colorByFormula = buildFormulaColorMap(formula);
  formula.forEach((item, index) => {
    const key = formulaKey(item);
    const colorKey = formulaColorKey(item);
    const color = colorByFormula.get(colorKey) || scriptFormulaColor(index);
    colorByKey.set(key, color);
    const parts = formulaDisplayParts(item);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "script-formula-item script-formula-token";
    button.dataset.formulaKey = key;
    button.setAttribute("data-formula-color-key", colorKey);
    button.setAttribute("aria-pressed", String(key === activeKey));
    button.style.setProperty("--script-color", color);
    button.style.setProperty("--script-soft", colorSoftBackground(color, .1));
    const titleLabel = element("span", "script-formula-title-label");
    titleLabel.append(element("span", "script-formula-label"), element("span", "script-formula-title", parts.title));
    button.append(
      titleLabel,
      document.createTextNode(" "),
      element("span", "script-formula-token", parts.content)
    );
    button.addEventListener("click", () => {
      const selectedKey = button.dataset.formulaKey;
      const panel = button.closest(".script-analysis-panel");
      activateScriptFormula(panel, selectedKey);
    });
    list.append(button);
    if (index < formula.length - 1) {
      list.append(element("span", "script-formula-connector", "+"));
    }
  });
  return list;
}

function renderScriptAnalysis(material) {
  const card = element("div", "raw-fact-card");
  const script = material.scriptAnalysis || {};
  const formula = Array.isArray(script.formula) ? script.formula : [];
  const evidence = Array.isArray(script.evidence) ? script.evidence : [];
  const scriptText = text(script.text);
  if (formula.length === 0 && !scriptText) {
    card.append(element("b", "", "脚本分析数据"));
    card.append(element("p", "muted", "暂无脚本分析数据"));
    return card;
  }
  const body = element("div", "collapsible-body");
  appendCollapsibleHead(card, "脚本分析数据", body);
  const panel = element("div", "script-analysis-panel");
  const colorByKey = new Map();
  formula.forEach((item, index) => {
    colorByKey.set(formulaKey(item), scriptFormulaColor(index));
  });
  const transcriptMount = scriptText ? element("div", "") : null;
  if (formula.length > 0) {
    const formulaSection = element("div", "script-analysis-section");
    const formulaHeader = element("div", "script-analysis-section-header");
    const formulaCopyButton = element("button", "copy-button", "复制内容公式");
    formulaCopyButton.type = "button";
    formulaCopyButton.addEventListener("click", () => copyScriptFormula(formulaCopyButton, formula));
    formulaHeader.append(element("b", "", "本视频内容公式"), formulaCopyButton);
    formulaSection.append(formulaHeader, renderScriptFormulaChain(formula, evidence, transcriptMount, scriptText, colorByKey));
    panel.append(formulaSection);
  }
  if (scriptText) {
    const scriptSection = element("div", "script-analysis-section");
    const scriptHeader = element("div", "script-analysis-section-header");
    const scriptCopyButton = element("button", "copy-button", "复制脚本");
    const activeKey = formula.length > 0 ? formulaKey(formula[0]) : "";
    scriptCopyButton.type = "button";
    scriptCopyButton.addEventListener("click", () => copyScriptText(scriptCopyButton, scriptText));
    scriptHeader.append(element("b", "", "本视频脚本"), scriptCopyButton);
    transcriptMount.append(renderScriptTranscript(scriptText, evidence, formula, activeKey, colorByKey));
    scriptSection.append(scriptHeader, transcriptMount);
    panel.append(scriptSection);
  }
  body.append(panel);
  card.append(body);
  return card;
}

function renderVideoPreview(material) {
  const videoData = material.video || {};
  const src = text(videoData.src);
  if (!src) {
    return null;
  }
  const video = document.createElement("video");
  video.className = "material-video";
  video.controls = true;
  video.preload = "none";
  video.src = src;
  const poster = text(videoData.poster);
  if (poster) {
    video.poster = poster;
  }
  return video;
}

function renderVisualStrip(material) {
  const strip = element("div", "visual-strip");
  const videoPanel = element("div", "video-panel");
  const videoPreview = renderVideoPreview(material);
  if (videoPreview) {
    videoPanel.append(videoPreview);
  } else {
    videoPanel.append(element("p", "muted", "暂无真实视频"));
  }
  strip.append(videoPanel, renderFrames(material));
  return strip;
}

function hydrateMaterialPanel(panel) {
  const timeline = panel.querySelector("[data-timeline-ready='false']");
  if (!timeline || !Array.isArray(timeline._timelineMetrics) || timeline._timelineMetrics.length === 0) {
    return;
  }
  timeline._timelineRenderMetric(timeline._timelineMetrics[0]);
  timeline.dataset.timelineReady = "true";
}

function renderMaterialPanel(material, selected) {
  const analysis = material.analysis || {};
  const panel = element("article", "material-card");
  panel.id = `panel-${safeId(material.materialId)}`;
  panel.setAttribute("role", "tabpanel");
  panel.setAttribute("aria-labelledby", `tab-${safeId(material.materialId)}`);
  panel.dataset.materialId = text(material.materialId);
  panel.hidden = !selected;

  const head = element("div", "material-head");
  const titleBlock = document.createElement("div");
  titleBlock.append(
    element("p", "eyebrow", `#${text(material.rank)}`),
    element("h3", "", displayText(material.materialName)),
    element("p", "muted", `状态 ${displayStatus(material.extractionStatus)}`)
  );
  head.append(titleBlock);

  const body = element("div", "material-body");
  body.append(
    renderHighlightFormula(analysis.highlightAnalyses),
    renderInteractionTimeline(material),
    renderFormula("人群与脚本证据", [analysis.audienceConclusion, analysis.scriptConclusion]),
    renderScriptAnalysis(material),
    renderFormula("综合判断与下一步", [analysis.integratedConclusion, `下一步：${text(analysis.nextAction)}`])
  );

  panel.append(head, renderVisualStrip(material), body);
  if (selected) {
    hydrateMaterialPanel(panel);
  }
  return panel;
}

function renderHighlightFormula(highlights) {
  const card = element("div", "formula");
  card.append(element("b", "", "高光帧观察"));
  if (!Array.isArray(highlights) || highlights.length === 0) {
    card.append(element("p", "", "暂无高光帧观察。"));
    return card;
  }
  highlights.forEach((item, index) => {
    const paragraph = element("p", "highlight-note");
    paragraph.append(
      element("b", "", `${index + 1}：`),
      document.createTextNode(displayText(item.visualObservation)),
      document.createElement("br"),
      element("small", "", displayText(item.commercialInterpretation))
    );
    card.append(paragraph);
  });
  return card;
}

function activateMaterialTab(tab) {
  const container = tab.closest("[data-material-tabs]");
  container.querySelectorAll('[role="tab"]').forEach((item) => {
    const selected = item === tab;
    item.setAttribute("aria-selected", String(selected));
    item.tabIndex = selected ? 0 : -1;
  });
  container.querySelectorAll('[role="tabpanel"]').forEach((panel) => {
    const selected = panel.dataset.materialId === tab.dataset.materialId;
    panel.hidden = !selected;
    if (selected) {
      hydrateMaterialPanel(panel);
    }
  });
  tab.focus();
}

function renderMaterialTabs() {
  const tabs = document.getElementById("material-tab-list");
  const panels = document.getElementById("material-panels");
  const materials = Array.isArray(reportData.materials) ? reportData.materials : [];
  tabs.replaceChildren();
  panels.replaceChildren();
  materials.forEach((material, index) => {
    const materialId = text(material.materialId);
    const selected = materialId === text(reportData.defaultMaterialId) || (!reportData.defaultMaterialId && index === 0);
    const tab = document.createElement("button");
    tab.type = "button";
    tab.id = `tab-${safeId(materialId)}`;
    tab.dataset.materialId = materialId;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(selected));
    tab.setAttribute("aria-controls", `panel-${safeId(materialId)}`);
    tab.tabIndex = selected ? 0 : -1;
    tab.textContent = `#${text(material.rank)} ${text(material.materialName, materialId)}`;
    tab.addEventListener("click", () => activateMaterialTab(tab));
    tabs.append(tab);
    panels.append(renderMaterialPanel(material, selected));
  });
  Array.from(tabs.querySelectorAll('[role="tab"]')).forEach((tab, index, allTabs) => {
    tab.addEventListener("keydown", (event) => {
      let nextIndex = index;
      if (event.key === "ArrowRight" || event.key === "ArrowDown") nextIndex = (index + 1) % allTabs.length;
      else if (event.key === "ArrowLeft" || event.key === "ArrowUp") nextIndex = (index - 1 + allTabs.length) % allTabs.length;
      else if (event.key === "Home") nextIndex = 0;
      else if (event.key === "End") nextIndex = allTabs.length - 1;
      else return;
      event.preventDefault();
      activateMaterialTab(allTabs[nextIndex]);
    });
  });
}

function renderNextActions() {
  const list = document.getElementById("next-actions");
  const priorityOrder = { high: 0, medium: 1, low: 2 };
  const actions = Array.isArray(reportData.conclusion?.nextActions) ? [...reportData.conclusion.nextActions] : [];
  actions.sort((left, right) => (priorityOrder[left.priority] ?? 1) - (priorityOrder[right.priority] ?? 1));
  list.replaceChildren();
  if (actions.length === 0) {
    const item = element("li", "rec-card");
    item.append(element("b", "", "暂无下一轮策略"), element("p", "", "请补充结构化结论后重新渲染。"));
    list.append(item);
    return;
  }
  actions.forEach((action) => {
    const item = element("li", "rec-card");
    item.append(element("b", "", displayText(action.title)), element("p", "", displayText(action.body)));
    list.append(item);
  });
}

document.querySelector(".frame-lightbox-close").addEventListener("click", closeFrameLightbox);
document.getElementById("frame-lightbox").addEventListener("click", (event) => {
  if (event.target.id === "frame-lightbox") {
    closeFrameLightbox();
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !document.getElementById("frame-lightbox").hidden) {
    closeFrameLightbox();
  }
});

function renderReport() {
  const period = reportData.period || {};
  document.getElementById("report-subtitle").textContent = `统计周期 ${text(period.actualStartDate)} - ${text(period.actualEndDate)}。`;
  document.getElementById("overall-conclusion").textContent = displayText(reportData.conclusion?.overallConclusion || "结论待补充：请提供 diagnostic-ai-analysis.json 后重新渲染。");
  renderPrimaryInsight("audience-primary", reportData.batchInsights?.audience, "", "暂无人群洞察");
  renderPrimaryInsight("script-primary", reportData.batchInsights?.script, "", "暂无脚本洞察");
  renderAudienceDashboard();
  renderScriptDashboard();
  renderMaterialTabs();
  renderNextActions();
}

renderReport();
</script>
</body>

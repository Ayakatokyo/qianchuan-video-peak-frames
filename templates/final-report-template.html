<script>
const reportData = JSON.parse(document.getElementById("report-data").textContent);
const presentation = reportData.presentation?.presentationSchemaVersion === 1
  ? reportData.presentation
  : null;

function presentationChapter(id) {
  const chapter = presentation?.chapters?.[id];
  return ["available", "partial"].includes(chapter?.availability) ? chapter : null;
}

function chapter01Insights(topic) {
  const insights = presentationChapter("chapter01")?.batchInsights;
  if (Array.isArray(insights)) return insights.filter((item) => item.topic === topic);
  return reportData.batchInsights?.[topic];
}

function chapter03Summary() {
  const groups = presentationChapter("chapter03")?.groups;
  if (!Array.isArray(groups)) return reportData.scripts?.labelSummary;
  return groups.flatMap((group) => (group.labels || []).map((label) => ({ ...label, level1: group.level1 })));
}

function chapter04Groups() {
  if (presentation?.chapters?.chapter04?.groups) {
    return Object.values(presentation.chapters.chapter04.groups);
  }
  const groups = reportData.conclusion?.highlightDashboard?.groups;
  return Array.isArray(groups) ? groups : [];
}

function chapter05Materials() {
  const projected = presentation?.chapters?.chapter05?.materials;
  if (!Array.isArray(projected)) {
    return Array.isArray(reportData.materials) ? reportData.materials : [];
  }
  const catalog = new Map((presentation.materials || []).map((item) => [text(item.materialId), item]));
  return projected.map((item) => {
    const catalogItem = catalog.get(text(item.materialId)) || {};
    return {
      materialId: item.materialId,
      materialName: item.materialName || catalogItem.materialName,
      rank: catalogItem.rank,
      highlightFrames: item.highlight?.frames || [],
      materialAudience: item.audience || {},
      scriptAnalysis: item.script || {},
      interactionTimeline: item.interaction || {},
      analysis: { ...(item.analysis || {}), highlightAnalyses: item.highlight?.analyses || [] },
      video: item.video || {},
    };
  });
}

function text(value, fallback = "") {
  if (value === null || value === undefined) return fallback;
  const result = String(value).trim();
  return result || fallback;
}

function formatNumber(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "-";
  if (Math.abs(number) >= 1000) return number.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  if (Number.isInteger(number)) return String(number);
  return number.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
}

function safeId(value) {
  return text(value, "unknown-material").replace(/[^a-zA-Z0-9_-]+/g, "_");
}

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
}

function createCollapseToggle(target, label = "数据", defaultExpanded = true) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "collapsible-toggle";
  const action = element("span", "collapsible-toggle-action", "");
  button.append(action);
  let expanded = Boolean(defaultExpanded);
  function sync() {
    button.setAttribute("aria-expanded", String(expanded));
    action.textContent = expanded ? `收起${label}` : `展开${label}`;
    target.hidden = !expanded;
  }
  button.addEventListener("click", () => {
    expanded = !expanded;
    sync();
  });
  sync();
  return button;
}

function appendCollapsibleHead(root, title, target, toggleLabel = "数据") {
  const head = element("div", "collapsible-head");
  if (title) target.prepend(element("b", "collapsible-body-title", title));
  head.append(createCollapseToggle(target, toggleLabel));
  root.append(head);
}

function createCollapsibleDataCard(title = "", toggleLabel = "数据") {
  const card = element("div", "raw-fact-card dashboard-data-card");
  const body = element("div", "collapsible-body");
  appendCollapsibleHead(card, title, body, toggleLabel);
  card.append(body);
  return { card, body };
}

function resetCollapsibleBody(body, title, ...nodes) {
  const titleNodes = title ? [element("b", "collapsible-body-title", title)] : [];
  body.replaceChildren(...titleNodes, ...nodes);
}

function getScriptDashboardBody() {
  const root = document.getElementById("script-dashboard");
  let body = root.querySelector(":scope > .dashboard-data-card > .collapsible-body");
  if (body) return body;
  const { card, body: nextBody } = createCollapsibleDataCard("", "脚本汇总数据");
  root.replaceChildren(card);
  return nextBody;
}

const metricLabels = {
  SHOW_COUNT: "展现次数",
  CLICK_COUNT: "点击次数",
  TRANSACTION_AMOUNT: "成交金额",
};

const dimensionLabels = {
  user_group_label_name: "八大人群",
  age: "年龄",
  gender: "性别",
  province_name: "省份",
  city_name: "城市",
};

const frameLabels = {
  zero_second: "视频第 0 秒画面",
  peak_top_1: "点击 Top1 峰值画面",
  peak_top_2: "点击 Top2 峰值画面",
  peak_top_3: "点击 Top3 峰值画面",
  peak_top_4: "点击 Top4 峰值画面",
  peak_top_5: "点击 Top5 峰值画面",
};

const statusLabels = {
  succeeded: "已完成",
  missing_summary: "缺少摘要",
  failed: "失败",
  pending: "待处理",
  not_started: "未开始",
  unknown: "未知",
};

function displayStatus(value) {
  const status = text(value, "unknown");
  return statusLabels[status] || status;
}

function displayText(value) {
  return text(value)
    .replace(/\bSHOW_COUNT\b/g, "展现次数")
    .replace(/\bCLICK_COUNT\b/g, "点击次数")
    .replace(/\bTRANSACTION_AMOUNT\b/g, "成交金额")
    .replace(/\b(?:audience|script|highlight):[^\s，。；、]+/g, "对应数据证据")
    .replace(/对应数据证据([ ·、，,]\s*对应数据证据)+/g, "对应数据证据");
}

function knownMaterialIds() {
  const materials = Array.isArray(reportData.materials) ? reportData.materials : [];
  return new Set(materials.map((material) => text(material.materialId)).filter(Boolean));
}

function activateMaterialById(materialId) {
  const targetId = text(materialId);
  if (!targetId) return false;
  const tabs = Array.from(document.querySelectorAll("#material-tab-list [data-material-id]"));
  const tab = tabs.find((item) => item.dataset.materialId === targetId);
  if (!tab) return false;
  activateMaterialTab(tab);
  const panel = document.getElementById(`panel-${safeId(targetId)}`);
  if (panel) {
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  return true;
}

function materialLink(materialId) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "material-link";
  button.setAttribute("data-material-link", materialId);
  button.textContent = materialId;
  button.title = "跳转到单素材深度分析";
  button.addEventListener("click", () => activateMaterialById(materialId));
  return button;
}

function renderTextWithMaterialLinks(value) {
  const fragment = document.createDocumentFragment();
  const content = displayText(value);
  const ids = knownMaterialIds();
  const pattern = /\b\d{15,}\b/g;
  let cursor = 0;
  let match;
  while ((match = pattern.exec(content)) !== null) {
    const materialId = match[0];
    if (match.index > cursor) {
      fragment.append(document.createTextNode(content.slice(cursor, match.index)));
    }
    fragment.append(ids.has(materialId) ? materialLink(materialId) : document.createTextNode(materialId));
    cursor = match.index + materialId.length;
  }
  if (cursor < content.length) {
    fragment.append(document.createTextNode(content.slice(cursor)));
  }
  return fragment;
}

function elementWithMaterialLinks(tag, className, value) {
  const node = element(tag, className);
  node.append(renderTextWithMaterialLinks(value));
  return node;
}

function humanizeEvidenceRef(reference) {
  const parts = text(reference).split(":");
  if (parts[0] === "audience" && parts.length >= 4) {
    const metric = metricLabels[parts[1]] || "人群数据";
    const dimension = dimensionLabels[parts[2]] || parts[2];
    return `${metric}：${dimension} ${parts.slice(3).join(":")}`;
  }
  if (parts[0] === "script" && parts.length >= 4) {
    const labels = parts.slice(2).filter(Boolean);
    const uniqueLabels = labels.filter((label, index) => labels.indexOf(label) === index);
    return `脚本标签：${uniqueLabels.join(" / ")}`;
  }
  if (parts[0] === "highlight" && parts.length >= 3) {
    return `高光帧：${frameLabels[parts[2]] || parts[2]}`;
  }
  return "结构化证据";
}

function renderInsightList(targetId, insightItems, emptyTitle) {
  const target = document.getElementById(targetId);
  target.replaceChildren();
  const insights = Array.isArray(insightItems) ? insightItems.filter((insight) => {
    return text(insight && insight.title) || text(insight && insight.conclusion);
  }) : [];
  if (insights.length === 0) {
    const empty = element("article", "insight-card insight-card-primary");
    empty.append(element("b", "", emptyTitle), element("p", "", "请补充结构化分析后重新渲染。"));
    target.append(empty);
    return;
  }
  insights.forEach((insight, index) => {
    const card = element("article", `insight-card${index === 0 ? " insight-card-primary" : ""}`);
    card.append(
      elementWithMaterialLinks("b", "", insight.title || `洞察 ${index + 1}`),
      elementWithMaterialLinks("p", "", insight.conclusion)
    );
    target.append(card);
  });
}

function topBuckets(dimension, limit = 8) {
  const buckets = Array.isArray(dimension?.buckets) ? dimension.buckets : [];
  return buckets.slice(0, limit);
}

function appendTooltipLines(tooltip, title, lines) {
  tooltip.replaceChildren();
  tooltip.append(element("b", "", title));
  (Array.isArray(lines) ? lines : [lines]).filter(Boolean).forEach((line) => {
    tooltip.append(element("span", "chart-tooltip-line", line));
  });
}

function renderColumnChart(title, buckets, valueFormatter, options = {}) {
  const card = element("div", `chart-card chart-card-full column-chart-card${options.cardClass ? ` ${options.cardClass}` : ""}`);
  if (!options.hideTitle) {
    card.append(element("h3", "", title));
  }
  if (!Array.isArray(buckets) || buckets.length === 0) {
    card.append(element("p", "muted", "暂无可视化数据"));
    return card;
  }
  const valueAccessor = options.valueAccessor || ((bucket) => Number(bucket.metricPercentage ?? bucket.value ?? 0));
  const tooltipFormatter = options.tooltipFormatter || valueFormatter || ((bucket) => `${formatNumber(valueAccessor(bucket))}%`);
  const tooltipLines = options.tooltipLines || ((bucket) => [tooltipFormatter(bucket)]);
  const axisValueFormatter = options.axisValueFormatter || ((value) => valueFormatter ? valueFormatter({ value, metricPercentage: value }) : `${formatNumber(value)}%`);
  const itemTitleFormatter = options.itemTitleFormatter || ((bucket) => `${text(bucket.bucket ?? bucket.label)}：${tooltipFormatter(bucket)}`);
  const axisLabel = text(options.axisLabel);
  const values = buckets.map((bucket) => valueAccessor(bucket));
  const maxValue = Math.max(...values, 1);
  const axisMax = Math.ceil(maxValue / 10) * 10 || 10;
  const itemCount = buckets.length;
  const labelStep = Math.max(1, Math.ceil(itemCount / (options.maxLabels || 12)));
  const chart = element("div", "column-chart");
  chart.style.setProperty("--column-count", String(itemCount));
  const axis = element("div", "column-y-axis");
  const axisTicks = Array.isArray(options.axisTicks) && options.axisTicks.length > 0
    ? options.axisTicks
    : [axisMax, axisMax * .75, axisMax * .5, axisMax * .25, 0];
  if (axisLabel) {
    axis.append(element("span", "column-axis-title", axisLabel));
  }
  axisTicks.forEach((value) => {
    axis.append(element("span", "", axisValueFormatter(value)));
  });
  const plot = element("div", "column-plot");
  plot.dataset.columnDensity = itemCount > 36 ? "dense" : itemCount > 18 ? "compact" : "normal";
  plot.style.gridTemplateColumns = `repeat(${itemCount}, minmax(0, 1fr))`;
  plot.style.setProperty("--column-gap", itemCount > 36 ? "0px" : itemCount > 24 ? "4px" : itemCount > 14 ? "8px" : "18px");
  buckets.forEach((bucket, index) => {
    const value = valueAccessor(bucket);
    const item = options.onBucketClick
      ? document.createElement("button")
      : element("div", "column-item");
    item.className = options.onBucketClick
      ? "column-item column-item-interactive"
      : "column-item";
    if (options.onBucketClick) {
      item.type = "button";
      const dataKey = text(options.bucketDataKey);
      if (dataKey) {
        item.dataset[dataKey] = text(bucket.bucket ?? bucket.label);
      }
      item.setAttribute("aria-label", `查看 ${text(bucket.bucket ?? bucket.label)} 的明细`);
      item.addEventListener("click", () => options.onBucketClick(bucket, item));
    }
    item.title = itemTitleFormatter(bucket);
    item.style.minWidth = itemCount > 24 ? "0" : "46px";
    const bar = element("div", "column-bar");
    bar.style.height = `${Math.max(2, value / axisMax * 100)}%`;
    bar.style.width = itemCount > 36 ? "10px" : itemCount > 24 ? "14px" : itemCount > 14 ? "22px" : "min(48px, 56%)";
    const label = element("span", "column-label", index % labelStep === 0 || index === itemCount - 1 ? text(bucket.bucket ?? bucket.label) : "");
    label.style.width = itemCount > 24 ? "48px" : itemCount > 14 ? "72px" : "92px";
    const tooltip = element("div", "chart-tooltip");
    appendTooltipLines(tooltip, text(bucket.bucket ?? bucket.label), tooltipLines(bucket));
    item.append(bar, label, tooltip);
    plot.append(item);
  });
  chart.append(axis, plot);
  card.append(chart);
  return card;
}

const chartColors = ["#9b6a37", "#d79a4b", "#6f7f5f", "#a14f38", "#6d5d4d", "#c7a36a", "#7d8f9a", "#b77d54"];

function buildPieSliceTooltipMap(buckets) {
  const total = buckets.reduce((sum, bucket) => sum + Number(bucket.metricPercentage || 0), 0) || 1;
  let cursor = 0;
  return buckets.map((bucket, index) => {
    const percentage = Number(bucket.metricPercentage || 0);
    const slice = {
      bucket,
      color: chartColors[index % chartColors.length],
      startRatio: cursor / total,
      endRatio: (cursor + percentage) / total,
    };
    cursor += percentage;
    return slice;
  });
}

function findPieBucketAtPosition(event, pie, slices) {
  const rect = pie.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const dx = event.clientX - centerX;
  const dy = event.clientY - centerY;
  const radius = Math.min(rect.width, rect.height) / 2;
  if (Math.sqrt(dx * dx + dy * dy) > radius) return null;
  const angle = (Math.atan2(dy, dx) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
  const ratio = angle / (Math.PI * 2);
  return slices.find((slice) => ratio >= slice.startRatio && ratio < slice.endRatio) || slices[slices.length - 1] || null;
}

function renderPieChart(title, buckets, options = {}) {
  const card = element("div", "chart-card");
  card.append(element("h3", "", title));
  if (!Array.isArray(buckets) || buckets.length === 0) {
    card.append(element("p", "muted", "暂无可视化数据"));
    return card;
  }
  const pieTooltipBuckets = buildPieSliceTooltipMap(buckets);
  const stops = pieTooltipBuckets.map((slice) => `${slice.color} ${slice.startRatio * 360}deg ${slice.endRatio * 360}deg`);
  const layout = element("div", "pie-layout");
  const pie = element("div", "pie-chart");
  pie.style.background = `conic-gradient(${stops.join(", ")})`;
  const pieTooltip = element("div", "chart-tooltip");
  pie.append(pieTooltip);
  const tooltipLines = options.tooltipLines || ((bucket) => [
    `占比 ${formatNumber(bucket.metricPercentage)}%`,
  ]);
  const legendValue = options.legendValue || ((bucket) => `${formatNumber(bucket.metricPercentage)}%`);
  function showPieTooltip(bucket) {
    appendTooltipLines(pieTooltip, text(bucket.bucket), tooltipLines(bucket));
    pie.title = `${text(bucket.bucket)}：${tooltipLines(bucket).join(" · ")}`;
    pieTooltip.classList.add("is-visible");
  }
  function syncPieTooltip(event) {
    const activeBucket = findPieBucketAtPosition(event, pie, pieTooltipBuckets);
    if (activeBucket) showPieTooltip(activeBucket.bucket);
  }
  pie.addEventListener("pointerenter", (event) => {
    syncPieTooltip(event);
  });
  pie.addEventListener("pointermove", (event) => {
    syncPieTooltip(event);
  });
  pie.addEventListener("pointerleave", () => {
    pieTooltip.classList.remove("is-visible");
  });
  showPieTooltip(pieTooltipBuckets[0].bucket);
  pieTooltip.classList.remove("is-visible");
  const legend = element("ul", "pie-legend");
  buckets.forEach((bucket, index) => {
    const item = element("li", "legend-item");
    item.title = `${text(bucket.bucket)}：${tooltipLines(bucket).join(" · ")}`;
    const swatch = element("span", "legend-swatch");
    swatch.style.background = chartColors[index % chartColors.length];
    item.append(swatch, element("span", "", text(bucket.bucket)), element("span", "", legendValue(bucket)));
    legend.append(item);
  });
  layout.append(pie, legend);
  card.append(layout);
  return card;
}

function createRegionScaleControl(state, onChange, totalCount) {
  if (!state.control) {
    const scale = element("div", "region-scale");
    const head = element("div", "region-scale-head");
    const title = element("span", "", "");
    const detail = element("span", "", "");
    head.append(title, detail);
    const scaleInput = document.createElement("input");
    scaleInput.type = "range";
    scaleInput.max = "1";
    scaleInput.step = "0.005";
    scaleInput.addEventListener("input", () => {
      state.ratio = Number(scaleInput.value);
      if (state.metaTitle && state.metaDetail) {
        const visibleRatio = Number(state.ratio || 0.35);
        state.metaTitle.textContent = `柱状图展示比例 ${Math.round(visibleRatio * 100)}%`;
        state.metaDetail.textContent = `当前显示 ${Math.max(1, Math.ceil(state.totalCount * visibleRatio))}/${state.totalCount}`;
      }
      onChange();
    });
    scale.append(head, scaleInput);
    state.control = scaleInput;
    state.metaTitle = title;
    state.metaDetail = detail;
    state.root = scale;
  }
  state.totalCount = totalCount;
  state.control.min = String(state.minRatio || 0.02);
  state.control.value = String(state.ratio || 0.35);
  function syncScaleMeta() {
    const visibleRatio = Number(state.ratio || 0.35);
    state.metaTitle.textContent = `柱状图展示比例 ${Math.round(visibleRatio * 100)}%`;
    state.metaDetail.textContent = `当前显示 ${Math.max(1, Math.ceil(totalCount * visibleRatio))}/${totalCount}`;
  }
  syncScaleMeta();
  return state.root;
}

function renderRegionChart(card, dimensions) {
  const regionHeader = element("div", "region-card-header");
  const regionTabs = element("div", "metric-switch region-tabs");
  regionTabs.append(element("span", "", "地域口径："));
  const body = element("div", "");
  regionHeader.append(element("h3", "", "地域分布"), regionTabs);
  card.append(regionHeader, body);
  const options = [
    ["province_name", "省份"],
    ["city_name", "城市"],
  ];
  const regionState = {
    province_name: { ratio: 0.35, minRatio: 0.05, minVisible: 6 },
    city_name: { ratio: 0.16, minRatio: 0.005, minVisible: 4 },
  };
  let activeDimensionKey = "province_name";
  const chartMount = element("div", "");
  const scaleMount = element("div", "");
  body.append(chartMount, scaleMount);
  function renderRegion(dimensionKey) {
    activeDimensionKey = dimensionKey || activeDimensionKey;

      itemTitleFormatter: (bucket) => `${text(bucket.bucket ?? bucket.label)}：人数 ${formatNumber(bucket.metricValue ?? bucket.value ?? 0)} · 地域占比 ${formatNumber(bucket.metricPercentage ?? 0)}%`,

function sortScriptBuckets(buckets) {

  });
}

function captureScriptBarTransition(sourceItem) {
  const sourceBar = sourceItem?.querySelector(".column-bar, .script-drill-primary-bar");
  if (!sourceBar) return null;
  const sourceRect = sourceBar.getBoundingClientRect();
  if (!sourceRect.width || !sourceRect.height) return null;
  return { clone: sourceBar.cloneNode(true), sourceRect };
}

function prefersReducedMotion() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function animateScriptDrill(transition, targetBar) {
  if (!transition || !targetBar || prefersReducedMotion()) {
    return;
  }
  const sourceRect = transition.sourceRect;
  const targetRect = targetBar.getBoundingClientRect();
  if (!targetRect.width || !targetRect.height) return;

  targetBar.classList.add("is-arriving");
  const clone = transition.clone;
  clone.classList.add("script-drill-moving-bar");
  Object.assign(clone.style, {
    left: `${sourceRect.left}px`,
    top: `${sourceRect.top}px`,
    width: `${sourceRect.width}px`,
    height: `${sourceRect.height}px`,
  });
  document.body.append(clone);

  let removed = false;
  const removeClone = () => {
    if (removed) return;
    removed = true;
    clone.remove();
    targetBar.classList.remove("is-arriving");
  };
  clone.addEventListener("transitionend", removeClone, { once: true });
  window.setTimeout(() => {
    const translateX = targetRect.left + targetRect.width / 2 - (sourceRect.left + sourceRect.width / 2);
    const translateY = targetRect.bottom - sourceRect.bottom;
    const scaleX = targetRect.width / sourceRect.width;
    const scaleY = targetRect.height / sourceRect.height;
    clone.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleX}, ${scaleY})`;
  }, 0);
  window.setTimeout(removeClone, 360);
}

function buildScriptDashboard() {
  const projectedSummary = chapter03Summary();
  const summary = Array.isArray(projectedSummary)
    ? projectedSummary
    : [];
  if (summary.length === 0) {
    return {
      control: element("p", "muted", "暂无脚本标签数据"),
      chartGrid: element("div", "chart-grid script-dashboard-overview"),
    };
  }
  const level1 = {};
  summary.forEach((item) => {
    const key = text(item.level1, "其他");
    level1[key] = (level1[key] || 0) + Number(item.occurrenceCount || 0);
  });
  const level1Buckets = sortScriptBuckets(Object.entries(level1).map(([label, value]) => ({ bucket: label, value })));
  const totalOccurrences = level1Buckets.reduce((sum, bucket) => sum + Number(bucket.value || 0), 0) || 1;
  const maxCount = Math.max(...level1Buckets.map((bucket) => Number(bucket.value || 0)), 0);
  const control = element("div", "script-dashboard-control");
  control.append(element("p", "script-dashboard-hint", "点击一级标签柱可查看二级标签分布"));
  const chartGrid = element("div", "chart-grid script-dashboard-overview");
  chartGrid.append(renderColumnChart("内容公式一级标签分布", level1Buckets, (bucket) => `${formatNumber(bucket.value ?? bucket.metricPercentage)} 次`, {
    axisTicks: [maxCount, Math.round(maxCount * 0.75), Math.round(maxCount * 0.5), Math.round(maxCount * 0.25), 0],
    axisValueFormatter: (value) => `${Math.round(value)} 次`,
    tooltipLines: (bucket) => [
      `占比 ${formatNumber((Number(bucket.value || 0) / totalOccurrences) * 100)}%`,
      `次数 ${formatNumber(bucket.value || 0)} 次`,
    ],
    bucketDataKey: "scriptLevel1",
    onBucketClick: (bucket, item) => renderScriptDrill(bucket.bucket, summary, bucket, item),
  }));
  return { control, chartGrid };
}

function formatTimelineSecond(second) {
  const safeSecond = Math.max(0, Math.round(Number(second || 0)));
  const minutes = Math.floor(safeSecond / 60);
  const seconds = safeSecond % 60;
  return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

function svgElement(tagName, attributes = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tagName);
  Object.entries(attributes).forEach(([key, value]) => {
    node.setAttribute(key, String(value));
  });
  return node;
}

function updateTimelineScaleTrack(state) {
  if (!state.control) return;
  const min = Number(state.control.min || 0);
  const max = Number(state.control.max || 1);
  const value = Number(state.control.value || state.visibleRatio || 1);
  const progress = max > min ? ((value - min) / (max - min)) * 100 : 100;
  state.control.style.setProperty("--timeline-scale-progress", `${Math.max(0, Math.min(100, progress))}%`);
}

function createTimelineScaleControl(state, onChange) {
  if (!state.control) {
    const scale = element("div", "timeline-scale");
    const head = element("div", "timeline-scale-head");
    const title = element("span", "", "");
    const detail = element("span", "", "");
    head.append(title, detail);
    const scaleInput = document.createElement("input");
    scaleInput.type = "range";
    scaleInput.min = "0.25";
    scaleInput.max = "1";
    scaleInput.step = "0.05";
    scaleInput.addEventListener("input", () => {
      state.visibleRatio = Number(scaleInput.value);
      updateTimelineScaleTrack(state);
      if (state.activeMetric) {
        onChange(state.activeMetric);
      }
    });
    scale.append(head, scaleInput);
    state.control = scaleInput;
    state.metaTitle = title;
    state.metaDetail = detail;
    state.root = scale;
  }
  const ratio = Number(state.visibleRatio || 1);
  const maxSecond = Number(state.maxSecond || 0);
  state.control.value = String(ratio);
  updateTimelineScaleTrack(state);
  state.metaTitle.textContent = `时间范围 ${Math.round(ratio * 100)}%`;
  state.metaDetail.textContent = maxSecond > 0
    ? `当前显示 00:00-${formatTimelineSecond(maxSecond * ratio)} / ${formatTimelineSecond(maxSecond)}`
    : "暂无可缩放时长";
  return state.root;
}

function renderTimelineChart(metric, visibleRatio = 1) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "timeline-chart");
  svg.setAttribute("viewBox", "0 0 840 320");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${text(metric.label)}趋势图`);
  const allPoints = Array.isArray(metric.points) ? metric.points : [];
  const maxSecond = Math.max(...allPoints.map((point) => Number(point.second || 0)), 1);
  const visibleMaxSecond = Math.max(1, maxSecond * Number(visibleRatio || 1));
  const points = allPoints.filter((point) => Number(point.second || 0) <= visibleMaxSecond);
  if (points.length === 0) {
    return svg;
  }
  const bounds = {
    left: 78,
    right: 810,
    top: 56,
    bottom: 266,
  };
  const width = bounds.right - bounds.left;
  const height = bounds.bottom - bounds.top;
  const maxValue = Math.max(...points.map((point) => Number(point.value || 0)), 1);
  const yTicks = [maxValue, maxValue * 0.75, maxValue * 0.5, maxValue * 0.25, 0];
  yTicks.forEach((value) => {
    const y = bounds.bottom - (Number(value || 0) / maxValue) * height;
    svg.append(
      svgElement("line", {
        class: "timeline-grid-line",
        x1: bounds.left,
        x2: bounds.right,
        y1: y.toFixed(2),
        y2: y.toFixed(2),
      }),
      svgElement("text", {
        class: "timeline-tick-label",
        x: bounds.left - 12,
        y: (y + 4).toFixed(2),
        "text-anchor": "end",
      })
    );
    svg.lastChild.textContent = formatNumber(value);
  });
  const xTicks = [0, 0.25, 0.5, 0.75, 1].map((ratio) => visibleMaxSecond * ratio);
  xTicks.forEach((second) => {
    const x = bounds.left + (Number(second || 0) / visibleMaxSecond) * width;
    svg.append(
      svgElement("line", {
        class: "timeline-grid-line",
        x1: x.toFixed(2),
        x2: x.toFixed(2),
        y1: bounds.top,
        y2: bounds.bottom,
      }),
      svgElement("text", {
        class: "timeline-tick-label",
        x: x.toFixed(2),
        y: bounds.bottom + 24,
        "text-anchor": "middle",
      })
    );
    svg.lastChild.textContent = formatTimelineSecond(second);
  });
  svg.append(
    svgElement("line", {
      class: "timeline-axis-line",
      x1: bounds.left,
      x2: bounds.left,
      y1: bounds.top,
      y2: bounds.bottom,
    }),
    svgElement("line", {
      class: "timeline-axis-line",
      x1: bounds.left,
      x2: bounds.right,
      y1: bounds.bottom,
      y2: bounds.bottom,
    })
  );
  const axisLabel = svgElement("text", {
    class: "timeline-metric-label",
    x: bounds.left,
    y: 30,
  });
  axisLabel.textContent = text(metric.label);
  svg.append(axisLabel);
  const pathData = points.map((point, index) => {
    const x = bounds.left + (Number(point.second || 0) / visibleMaxSecond) * width;
    const y = bounds.bottom - (Number(point.value || 0) / maxValue) * height;
    return `${index === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(" ");
  const path = svgElement("path", {
    class: "timeline-line",
    d: pathData,
  });
  svg.append(path);
  const peak = metric.peak || {};
  points.forEach((point) => {
    const cx = bounds.left + (Number(point.second || 0) / visibleMaxSecond) * width;
    const cy = bounds.bottom - (Number(point.value || 0) / maxValue) * height;
    const group = svgElement("g", {
      class: "timeline-point-hitbox",
      tabindex: "0",
    });
    group.append(
      svgElement("circle", {
        cx: cx.toFixed(2),
        cy: cy.toFixed(2),
        r: "10",
        fill: "transparent",
      }),
      svgElement("circle", {
        cx: cx.toFixed(2),
        cy: cy.toFixed(2),
        r: "4",
        class: "timeline-point-dot",
      })
    );
    const tooltip = svgElement("g", {
      class: "timeline-tooltip",
      transform: `translate(${Math.min(bounds.right - 150, Math.max(bounds.left, cx - 74)).toFixed(2)} ${Math.max(bounds.top + 8, cy - 58).toFixed(2)})`,
    });
    tooltip.append(svgElement("rect", {
      width: "148",
      height: "46",
      rx: "8",
      fill: "rgba(255, 255, 255, .96)",
      stroke: "rgba(82, 45, 24, .16)",
    }));
    const tooltipTime = svgElement("text", {
      x: "12",
      y: "18",
      fill: "#2a170f",
      "font-size": "12",
      "font-weight": "800",
    });
    tooltipTime.textContent = formatTimelineSecond(point.second);
    const tooltipValue = svgElement("text", {
      x: "12",
      y: "36",
      fill: "#806758",
      "font-size": "12",
    });
    tooltipValue.textContent = `${text(metric.label)}：${formatNumber(point.value)}`;
    tooltip.append(tooltipTime, tooltipValue);
    group.append(tooltip);
    svg.append(group);
  });
  if (peak.second !== undefined && peak.value !== undefined && Number(peak.second || 0) <= visibleMaxSecond) {
    const cx = bounds.left + (Number(peak.second || 0) / visibleMaxSecond) * width;
    const cy = bounds.bottom - (Number(peak.value || 0) / maxValue) * height;
    const dot = svgElement("circle", {
      class: "timeline-peak-dot",
      cx: cx.toFixed(2),
      cy: cy.toFixed(2),
      r: "6",
    });
    const label = svgElement("text", {
      class: "timeline-axis-label",
      x: Math.min(bounds.right - 34, cx + 10).toFixed(2),
      y: Math.max(bounds.top + 12, cy - 10).toFixed(2),
    });
    label.textContent = "峰值";
    svg.append(dot, label);
  }
  return svg;
}

function renderChipList(items) {
  const list = element("div", "chip-list");
  items.forEach((item) => {
    const label = typeof item === "string" ? item : `${text(item.level1)} / ${text(item.level2)}`;
    if (label.trim()) {
      list.append(element("span", "chip", label));
    }
  });
  return list;
}

function scriptFormulaLabel(item) {
  if (typeof item === "string") return text(item);
  return `${text(item.level1)} / ${text(item.level2)}`;
}

function formulaKey(item) {
  if (typeof item === "string") return `formula:${text(item)}`;
  const level1 = text(item && item.level1);
  const level2 = text(item && item.level2);
  const fallback = text(item && item.label, text(item && item.name, "unknown"));
  return `formula:${level1 || fallback}:${level2 || fallback}`;
}

function formulaColorKey(item) {
  if (typeof item === "string") return text(item, "内容公式");
  return text(item && item.level1, text(item && item.label, text(item && item.name, "内容公式")));
}

function scriptFormulaColor(index) {
  const palette = [
    "#2f8f5b",
    "#d5543f",
    "#d98324",
    "#3478c7",
    "#169a9a",
    "#c4477e",
    "#7157c8",
    "#6f7f2f",
    "#b35d24",
    "#4f7f96",
    "#a64d79",
    "#8a6f2a"
  ];
  if (index < palette.length) return palette[index];
  const hue = (index * 47 + 19) % 360;
  return `hsl(${hue} 64% 42%)`;
}

function buildFormulaColorMap(formula) {
  const colorByFormula = new Map();
  if (!Array.isArray(formula)) return colorByFormula;
  formula.forEach((item) => {
    const key = formulaColorKey(item);
    if (key && !colorByFormula.has(key)) {
      colorByFormula.set(key, scriptFormulaColor(colorByFormula.size));
    }
  });
  return colorByFormula;
}

function colorSoftBackground(color, alpha) {
  if (color.startsWith("#")) {
    const raw = color.slice(1);
    const normalized = raw.length === 3 ? raw.split("").map((part) => part + part).join("") : raw;
    const red = parseInt(normalized.slice(0, 2), 16);
    const green = parseInt(normalized.slice(2, 4), 16);
    const blue = parseInt(normalized.slice(4, 6), 16);
    if ([red, green, blue].every(Number.isFinite)) {
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }
  }
  return `color-mix(in srgb, ${color} ${Math.round(alpha * 100)}%, transparent)`;
}

function formulaDisplayParts(item) {
  if (typeof item === "string") {
    return { title: "内容公式", content: text(item) };
  }
  const title = text(item && item.level1, "内容公式");
  const content = text(item && item.level2, title);
  return { title, content };
}

function formulaCopyText(formula) {
  if (!Array.isArray(formula)) return "";
  return formula.map((item) => {
    if (typeof item === "string") return text(item);
    const parts = formulaDisplayParts(item);
    return parts.title === parts.content ? parts.title : `${parts.title}-${parts.content}`;
  }).filter(Boolean).join(" + ");
}

function copyTextToClipboard(button, value) {
  const copyValue = text(value);
  if (!copyValue) return;
  const defaultLabel = button.dataset.defaultLabel || button.textContent || "复制";
  button.dataset.defaultLabel = defaultLabel;
  function showStatus(label) {
    button.textContent = label;
    window.clearTimeout(button._copyStatusTimer);
    button._copyStatusTimer = window.setTimeout(() => {
      button.textContent = defaultLabel;
    }, 1400);
  }
  const fallbackCopy = () => {
    const textarea = document.createElement("textarea");
    textarea.value = copyValue;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.append(textarea);
    textarea.select();
    try {
      const copied = document.execCommand("copy");
      showStatus(copied ? "已复制" : "复制失败");
    } catch (error) {
      showStatus("复制失败");
    } finally {
      textarea.remove();
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(copyValue).then(() => showStatus("已复制")).catch(fallbackCopy);
    return;
  }
  fallbackCopy();
}

function copyScriptFormula(button, formula) {
  copyTextToClipboard(button, formulaCopyText(formula));
}

function copyScriptText(button, scriptText) {
  copyTextToClipboard(button, scriptText);
}

function formulaMatchesEvidence(formulaItem, evidenceItem) {
  return formulaEvidenceMatchScore(formulaItem, evidenceItem) > 0;
}

function formulaEvidenceMatchScore(formulaItem, evidenceItem) {
  const formulaLevel1 = text(formulaItem.level1);
  const formulaLevel2 = text(formulaItem.level2);
  const evidenceLevel1 = text(evidenceItem.level1);
  const evidenceLevel2 = text(evidenceItem.level2);
  if (formulaLevel2 && (formulaLevel2 === evidenceLevel2 || formulaLevel2 === evidenceLevel1)) return 3;
  if (formulaLevel1 && (formulaLevel1 === evidenceLevel1 || formulaLevel1 === evidenceLevel2)) return 1;
  return 0;
}

function matchingEvidenceSentences(formulaItem, evidence) {
  if (!formulaItem || !Array.isArray(evidence)) return [];
  const sentences = [];
  evidence.forEach((item) => {
    const sentence = text(item.sentence);
    if (sentence && formulaMatchesEvidence(formulaItem, item) && !sentences.includes(sentence)) {
      sentences.push(sentence);
    }
  });
  return sentences;
}

function evidenceFormulaMeta(evidenceItem, formula, colorByKey) {
  let matchedIndex = -1;
  let bestScore = 0;
  formula.forEach((item, index) => {
    const score = formulaEvidenceMatchScore(item, evidenceItem);
    if (score > bestScore) {
      bestScore = score;
      matchedIndex = index;
    }
  });
  if (matchedIndex < 0) return null;
  const item = formula[matchedIndex];
  const key = formulaKey(item);
  const colorKey = formulaColorKey(item);
  return {
    key,
    colorKey,
    color: colorByKey.get(key) || scriptFormulaColor(matchedIndex),
    title: scriptFormulaLabel(item)
  };
}

function collectScriptEvidenceRanges(scriptText, evidence, formula, colorByKey) {
  const fullText = text(scriptText);
  if (!fullText || !Array.isArray(evidence) || !Array.isArray(formula)) return [];
  const ranges = [];
  evidence.forEach((item) => {
    const sentence = text(item && item.sentence);
    const meta = sentence ? evidenceFormulaMeta(item, formula, colorByKey) : null;
    if (!sentence || !meta) return;
    let cursor = 0;
    while (cursor < fullText.length) {
      const start = fullText.indexOf(sentence, cursor);
      if (start < 0) break;
      ranges.push({ start, end: start + sentence.length, ...meta });
      cursor = start + sentence.length;
    }
  });
  ranges.sort((left, right) => left.start - right.start || right.end - left.end);
  const merged = [];
  ranges.forEach((range) => {
    const previous = merged[merged.length - 1];
    if (!previous || range.start >= previous.end) {
      merged.push(range);
    }
  });
  return merged;
}

function activateScriptFormula(container, activeKey) {
  if (!container) return;
  container.querySelectorAll("[data-formula-key]").forEach((node) => {
    const isActive = Boolean(activeKey && node.dataset.formulaKey === activeKey);
    if (node.classList.contains("script-formula-token")) {
      node.setAttribute("aria-pressed", String(isActive));
    }
    if (node.classList.contains("script-segment")) {
      node.classList.toggle("is-active", isActive);
      node.classList.toggle("script-highlight", isActive);
    }
  });
}

function applyScriptFormulaState(root, activeKey) {
  activateScriptFormula(root, activeKey);
}

function appendHighlightedTranscript(root, scriptText, highlightSentences) {
  root.replaceChildren();
  const fullText = text(scriptText);
  const ranges = [];
  highlightSentences.forEach((sentence) => {
    const highlightText = text(sentence);
    const start = fullText.indexOf(highlightText);
    if (start >= 0) {
      ranges.push({ start, end: start + highlightText.length });
    }
  });
  ranges.sort((left, right) => left.start - right.start);
  const merged = [];
  ranges.forEach((range) => {
    const previous = merged[merged.length - 1];
    if (!previous || range.start >= previous.end) {
      merged.push(range);
    }
  });
  if (merged.length === 0) {
    root.textContent = fullText;
    return;
  }
  let cursor = 0;
  merged.forEach((range) => {
    if (range.start > cursor) {
      root.append(document.createTextNode(fullText.slice(cursor, range.start)));
    }
    root.append(element("span", "script-highlight", fullText.slice(range.start, range.end)));
    cursor = range.end;
  });
  if (cursor < fullText.length) {
    root.append(document.createTextNode(fullText.slice(cursor)));
  }
}

function renderScriptTranscript(scriptText, evidence, formula, activeKey, colorByKey) {
  const transcript = element("div", "transcript script-text-body script-transcript");
  const fullText = text(scriptText);
  const ranges = collectScriptEvidenceRanges(fullText, evidence, formula, colorByKey);
  if (ranges.length === 0) {
    transcript.textContent = fullText;
    return transcript;
  }
  let cursor = 0;
  ranges.forEach((range) => {
    if (range.start > cursor) {
      transcript.append(document.createTextNode(fullText.slice(cursor, range.start)));
    }
    const segment = element("span", "script-segment", fullText.slice(range.start, range.end));
    segment.dataset.formulaKey = range.key;
    segment.setAttribute("data-formula-color-key", range.colorKey);
    segment.title = range.title;
    segment.style.setProperty("--script-color", range.color);
    segment.style.setProperty("--script-soft", colorSoftBackground(range.color, .14));
    segment.style.setProperty("--script-active-bg", colorSoftBackground(range.color, .28));
    segment.addEventListener("click", () => {
      const panel = segment.closest(".script-analysis-panel");
      activateScriptFormula(panel, segment.dataset.formulaKey);
    });
    transcript.append(segment);
    cursor = range.end;
  });
  if (cursor < fullText.length) {
    transcript.append(document.createTextNode(fullText.slice(cursor)));
  }
  applyScriptFormulaState(transcript, activeKey);
  return transcript;
}

function renderScriptFormulaChain(formula, evidence, transcriptMount, scriptText, colorByKey) {
  const list = element("div", "script-formula-chain script-formula-text");
  const activeKey = formula.length > 0 ? formulaKey(formula[0]) : "";
  const colorByFormula = buildFormulaColorMap(formula);
  formula.forEach((item, index) => {
    const key = formulaKey(item);
    const colorKey = formulaColorKey(item);
    const color = colorByFormula.get(colorKey) || scriptFormulaColor(index);
    colorByKey.set(key, color);
    const parts = formulaDisplayParts(item);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "script-formula-item script-formula-token";
    button.dataset.formulaKey = key;
    button.setAttribute("data-formula-color-key", colorKey);
    button.setAttribute("aria-pressed", String(key === activeKey));
    button.style.setProperty("--script-color", color);
    button.style.setProperty("--script-soft", colorSoftBackground(color, .1));
    const titleLabel = element("span", "script-formula-title-label");
    titleLabel.append(element("span", "script-formula-label"), element("span", "script-formula-title", parts.title));
    button.append(
      titleLabel,
      document.createTextNode(" "),
      element("span", "script-formula-token", parts.content)
    );
    button.addEventListener("click", () => {
      const selectedKey = button.dataset.formulaKey;
      const panel = button.closest(".script-analysis-panel");
      activateScriptFormula(panel, selectedKey);
    });
    list.append(button);
    if (index < formula.length - 1) {
      list.append(element("span", "script-formula-connector", "+"));
    }
  });
  return list;
}

function renderHighlightWorkspace(material) {
  const analysis = material.analysis || {};
  const root = element("div", "material-highlight-workspace");
  const observations = element("div", "material-highlight-observations");
  const frames = Array.isArray(material.highlightFrames) ? material.highlightFrames : [];
  const selectedRefs = new Set(frames.map((frame) => `highlight:${text(material.materialId)}:${text(frame.rankType)}`));
  const framesByReference = new Map(frames.map((frame) => [
    `highlight:${text(material.materialId)}:${text(frame.rankType)}`,
    frame,
  ]));
  const frameNodes = [];
  const selectionActions = element("div", "highlight-selection-actions");
  const selectionHint = element("p", "highlight-selection-hint", "被选中的高光帧对应的说明会出现在下方。");
  const selectAll = element("button", "highlight-selection-button", "全选高光帧");
  const selectNone = element("button", "highlight-selection-button", "全不选高光帧");
  selectAll.type = "button";
  selectNone.type = "button";

  function renderObservations() {
    observations.replaceChildren(renderHighlightFormula(
      Array.isArray(analysis.highlightAnalyses)
        ? analysis.highlightAnalyses.filter((item) => selectedRefs.has(text(item.frameRef)))
        : [],
      framesByReference
    ));
  }
  function syncSelection() {
    frameNodes.forEach(({ figure, reference }) => {
      const selected = selectedRefs.has(reference);
      figure.classList.toggle("is-selected", selected);
      figure._selectionInput.checked = selected;
    });
    selectAll.disabled = selectedRefs.size === framesByReference.size;
    selectNone.disabled = selectedRefs.size === 0;
    renderObservations();
  }
  const selection = {
    register: (figure, reference) => frameNodes.push({ figure, reference }),
    set: (reference, selected) => {
      if (selected) selectedRefs.add(reference);
      else selectedRefs.delete(reference);
      syncSelection();
    }
  };
  selectAll.addEventListener("click", () => {
    framesByReference.forEach((_, reference) => selectedRefs.add(reference));
    syncSelection();
  });
  selectNone.addEventListener("click", () => {
    selectedRefs.clear();
    syncSelection();
  });

function materialInteractionSummary(timeline) {

  const clicks = metrics.find((metric) => text(metric.metric) === "CLICK_COUNT");
  if (!clicks?.peak) return "暂无可用于判断的互动时序数据。";
  const points = Array.isArray(clicks.points) ? clicks.points : [];
  const first = points[0] || {};
  const peak = clicks.peak;
  const trend = Number(peak.value) > Number(first.value) ? "高于开场水平" : "未高于开场水平";
  return `整体点击次数在 ${formatNumber(peak.second)} 秒达到 ${formatNumber(peak.value)} 次峰值，${trend}；建议重点复盘峰值前后的画面、利益点与行动引导，并用下方曲线验证后续素材的复现效果。`;

function highFrameFactsByReference() {

function displayMaterialName(value, fallback) {

function displayPeakRank(rankType) {

function renderDashboardFrame(reference, fact) {
  const { material, frame } = fact;
  const materialId = text(material.materialId);
  const materialName = displayMaterialName(material.materialName, materialId);
  const peakRank = displayPeakRank(frame.rankType);
  const rankLabel = peakRank ? `点击 Top${peakRank} 波峰画面` : (frameLabels[text(frame.rankType)] || text(frame.rankType));
  const timingLabel = `${formatNumber(frame.durationSec)}s · 点击 ${formatNumber(frame.metricValue)}`;
  const caption = `${rankLabel} · ${timingLabel}`;
  const card = element("article", "highlight-frame-card");
  card.dataset.frameRef = reference;
  const figure = document.createElement("figure");
  const preview = document.createElement("button");
  const image = document.createElement("img");
  preview.type = "button";
  preview.className = "highlight-frame-preview";
  preview.setAttribute("aria-label", `查看大图：${materialName}，${caption}`);
  image.src = text(frame.framePath);
  image.alt = `${materialName} 高光画面`;
  image.loading = "lazy";
  image.decoding = "async";
  preview.append(image);
  preview.addEventListener("click", () => openFrameLightbox(text(frame.framePath), caption));
  figure.append(preview);

  const meta = element("div", "highlight-frame-meta");
  const source = element("button", "highlight-source-link", `查看素材：${materialName}`);
  source.type = "button";
  source.title = "跳转到单素材深度分析";
  source.addEventListener("click", () => activateMaterialById(materialId));
  meta.append(element("small", "", rankLabel), element("span", "highlight-frame-timing", timingLabel), source);
  card.append(figure, meta);
  return card;
}

function renderHighlightFramePage(panel) {
  const factsByReference = highFrameFactsByReference();
  const refs = Array.isArray(panel._highlightFrameRefs) ? panel._highlightFrameRefs : [];
  const pageCount = Math.max(1, Math.ceil(refs.length / HIGHLIGHT_FRAMES_PER_PAGE));
  const page = Math.min(Math.max(0, Number(panel._highlightPage || 0)), pageCount - 1);
  panel._highlightPage = page;
  const grid = panel.querySelector(".highlight-frame-grid");
  const status = panel.querySelector(".highlight-page-status");
  const previous = panel.querySelector("[data-highlight-page='previous']");
  const next = panel.querySelector("[data-highlight-page='next']");
  if (!grid) return;
  grid.replaceChildren();
  const pageRefs = refs.slice(page * HIGHLIGHT_FRAMES_PER_PAGE, (page + 1) * HIGHLIGHT_FRAMES_PER_PAGE);
  pageRefs.forEach((reference) => {
    const fact = factsByReference.get(text(reference));
    if (fact) grid.append(renderDashboardFrame(text(reference), fact));
  });
  for (let index = pageRefs.length; index < HIGHLIGHT_FRAMES_PER_PAGE; index += 1) {
    const placeholder = element("div", "highlight-frame-card highlight-frame-placeholder");
    placeholder.setAttribute("aria-hidden", "true");
    grid.append(placeholder);
  }
  if (status) {
    status.textContent = `${page + 1} / ${pageCount}`;
  }
  if (previous) previous.disabled = page <= 0;
  if (next) next.disabled = page >= pageCount - 1;
}

function renderHighlightPagination(panel, frameCount) {
  const pageCount = Math.max(1, Math.ceil(frameCount / HIGHLIGHT_FRAMES_PER_PAGE));
  const pagination = element("div", "highlight-pagination");
  const previous = document.createElement("button");
  const status = element("span", "highlight-page-status");
  const next = document.createElement("button");
  previous.type = "button";
  next.type = "button";
  previous.dataset.highlightPage = "previous";
  next.dataset.highlightPage = "next";
  previous.textContent = "上一页";
  next.textContent = "下一页";
  previous.addEventListener("click", () => {
    panel._highlightPage = Math.max(0, Number(panel._highlightPage || 0) - 1);
    renderHighlightFramePage(panel);
  });
  next.addEventListener("click", () => {
    panel._highlightPage = Math.min(pageCount - 1, Number(panel._highlightPage || 0) + 1);
    renderHighlightFramePage(panel);
  });
  pagination.append(previous, status, next);
  return pagination;
}

      else if (event.key === "ArrowLeft" || event.key === "ArrowUp") nextIndex = (index - 1 + allTabs.length) % allTabs.length;
      else if (event.key === "Home") nextIndex = 0;
      else if (event.key === "End") nextIndex = allTabs.length - 1;
      else return;
      event.preventDefault();
      activateTopDimensionTab(allTabs[nextIndex]);
    });
  });
  root.append(tabList, panelRoot);
}

function activateTopDimensionTab(tab) {
  const root = document.getElementById("top-dimension-conclusions");
  root.querySelectorAll(".top-dimension-tabs [role='tab']").forEach((item) => {
    const selected = item === tab;
    item.setAttribute("aria-selected", String(selected));
    item.tabIndex = selected ? 0 : -1;
  });
  root.querySelectorAll(".top-dimension-panel[role='tabpanel']").forEach((panel) => {
    panel.hidden = panel.dataset.dimensionKey !== tab.dataset.dimensionKey;
  });
  tab.focus();
}

document.querySelector(".frame-lightbox-close").addEventListener("click", closeFrameLightbox);
document.getElementById("frame-lightbox").addEventListener("click", (event) => {
  if (event.target.id === "frame-lightbox") {
    closeFrameLightbox();
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !document.getElementById("frame-lightbox").hidden) {
    closeFrameLightbox();
  }
});

function renderReport() {
  const period = reportData.period || {};
  document.getElementById("report-subtitle").textContent = `统计周期 ${text(period.actualStartDate)} - ${text(period.actualEndDate)}`;
  renderTopDimensionConclusions();
  renderInsightList("audience-primary", chapter01Insights("audience"), "暂无人群洞察");
  renderAudiencePreferences();
  renderAudienceDashboard();
  renderInsightList("script-primary", chapter01Insights("script"), "暂无脚本洞察");
  renderScriptDashboard();
  renderHighlightDashboard();
  renderMaterialTabs();
  renderNextActions();
}

renderReport();
</script>

short-description: "采集千川短视频投放素材并生成包含高光帧、脚本与人群事实的分析报告"
tags:
  - 千川
  - 短视频素材
  - 素材分析
  - 高光帧
compatibility:
  - data-analysis
  - python
  - html-report
requires:
  env:
    - ENV_BACKEND_HOST
    - YUCE_AUTHORIZATION
    - YUCE_SESSION_ID
    - YCSESSIONID
market:
  title: "千川投放素材诊断"
  summary: "按授权店铺、广告主和日期范围采集千川短视频素材，完成秒级诊断、高光帧与可审计的素材分析报告。"
  category:
    key: short_video_content
    label: 短视频内容
  badges:
    - label: 千川
      tone: blue
    - label: 素材分析
      tone: green
    - label: 高光帧
      tone: orange
  examples:
    - title: 千川素材分析
      prompt: "按授权店铺、广告主和日期范围分析 Top 千川短视频素材"
    - title: 高光帧复盘
      prompt: "采集千川素材详情并生成带高光帧的投放复盘报告"
skill_form:
  - key: api_shop
    type: api_shop
    label: 千川授权店铺
    description: 从千川 API 已授权店铺中选择；只用于第一步素材报表查询
    application_id: OCEANENGINE
    multiple: false
    required: true
  - key: advertiser_id
    type: api_advertiser
    label: 千川广告主
    description: 先选择报表授权店铺，再从该店铺的已授权广告主中选择；用于第一步素材报表查询
    shop_field: api_shop
    required: true
  - key: rpa_shop
    type: rpa_shop
    label: 千川广告主
    description: 请选择与广告主同一投放主体的千川 RPA 已授权账号；只用于第二步逐素材诊断，ID 格式不同，不直接比较
    application_id: RPA_JULIANG_QC
    value_format: both
    multiple: false
    required: true
  - key: date_range
    type: daterange
    label: 时间范围
    description: 对应起止日期，日期格式为 YYYY-MM-DD；不含执行日和前一日
    placeholder: "开始日期,结束日期"
    format: YYYY-MM-DD
    value_format: YYYY-MM-DD
    max_policy: t_plus_2
    required: true
  - key: top_n
    type: number
    label: 详情素材数
    description: 需要获取互动时序、人群、脚本和可选高光帧详情的素材数量
    required: true
    default: 10
    min: 1
    step: 1
    precision: 0
    addon_after: 条
